                    <select class="modal-input" id="new-track-instrument" style="margin-top:4px">
                        <option value="acoustic_grand_piano">Piano</option>
                        <option value="electric_guitar_clean">Elektrische Gitaar</option>
                        <option value="acoustic_guitar_nylon">Akoestische Gitaar</option>
                        <option value="electric_bass_finger">Basgitaar</option>
                        <option value="violin">Viool</option>
                        <option value="string_ensemble_1">Strijkensemble</option>
                        <option value="trumpet">Trompet</option>
                        <option value="alto_sax">Saxofoon</option>
                        <option value="flute">Fluit</option>
                        <option value="synth_lead_2_sawtooth">Synth Lead</option>
                        <option value="synth_pad_1_new_age">Synth Pad</option>
                        <option value="synth_drum">Synth Drums</option>
                    </select>
                </div>
                <input class="modal-input" id="new-track-name" placeholder="Track naam (optioneel)">
                <div class="modal-buttons">
                    <button class="modal-btn" id="add-track-cancel">Annuleren</button>
                    <button class="modal-btn primary" id="add-track-confirm" style="display:none">Toevoegen</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);

        let selectedType = null;
        const confirmBtn = overlay.querySelector('#add-track-confirm');
        const midiSelect = overlay.querySelector('#midi-instrument-select');

        overlay.querySelector('#add-audio-track').addEventListener('click', () => {
            selectedType = 'audio';
            overlay.querySelector('#add-audio-track').style.outline = '2px solid var(--accent)';
            overlay.querySelector('#add-midi-track').style.outline = '';
            midiSelect.style.display = 'none';
            confirmBtn.style.display = 'block';
        });
        overlay.querySelector('#add-midi-track').addEventListener('click', () => {
            selectedType = 'midi';
            overlay.querySelector('#add-midi-track').style.outline = '2px solid var(--purple)';
            overlay.querySelector('#add-audio-track').style.outline = '';
            midiSelect.style.display = 'block';
            confirmBtn.style.display = 'block';
        });
        overlay.querySelector('#add-track-cancel').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

        confirmBtn.addEventListener('click', () => {
            const name = overlay.querySelector('#new-track-name').value;
            const instrument = overlay.querySelector('#new-track-instrument').value;
            this.addTrack(name, selectedType, selectedType === 'midi' ? instrument : null);
            overlay.remove();
        });
    }

    addTrack(name, type = 'audio', instrument = null) {
        const id = uuid();
        const index = state.tracks.length;
        const isMidi = type === 'midi';
        const track = {
            id,
            name: name || `${isMidi ? 'MIDI' : 'Audio'} ${index + 1}`,
            type, // 'audio' or 'midi'
            instrument: instrument || (isMidi ? 'acoustic_grand_piano' : null),
            color: TRACK_COLORS[index % TRACK_COLORS.length],
            volume: 0.8,
            pan: 0,
            mute: false,
            solo: false,
            armed: false,
            regions: []
            // Audio regions: { id, soundId, startBeat, offset, duration, name, peaks }
            // MIDI regions:  { id, startBeat, lengthBeats, name, notes: [{note, startBeat, lengthBeats, velocity}] }
        };
        state.tracks.push(track);
        this.engine.createTrackNodes(id);
        // Pre-load instrument for MIDI tracks
        if (isMidi && this.instruments) {
            this.instruments.loadInstrument(track.instrument);
        }
        this._renderTrackHeaders();
        this._renderMixer();
        this.renderer.resize();
    }

    removeTrack(trackId) {
        state.tracks = state.tracks.filter(t => t.id !== trackId);
        this.engine.removeTrackNodes(trackId);
        if (state.selectedTrackId === trackId) state.selectedTrackId = null;
        this._renderTrackHeaders();
        this._renderMixer();
        this.renderer.resize();
    }

    selectTrack(trackId) {
        state.selectedTrackId = trackId;
        this._renderTrackHeaders();
    }

    // Transport
    play() {
        if (state.transport.state === 'paused') {
            state.transport.state = 'playing';
            this.engine.unpause();
        } else if (state.transport.state !== 'playing') {
            state.transport.state = 'playing';
            this.engine.play();
        }
        this._updateTransportUI();
    }

    stop() {
        this.engine.stop();
        if (state.transport.state === 'recording') {
            this._finishRecording();
        }
        state.transport.state = 'stopped';
        state.transport.position = 0;
        this._updateTransportUI();
    }

    pause() {
        if (state.transport.state === 'playing') {
            state.transport.state = 'paused';
            this.engine.pause();
            this._updateTransportUI();
        }
    }

    togglePlay() {
        if (state.transport.state === 'playing') {
            this.pause();
        } else {
            this.play();
        }
    }

    async toggleRecord() {
        if (state.transport.state === 'recording') {
            this.stop();
            return;
        }

        // Find armed track
        const armedTrack = state.tracks.find(t => t.armed);
        if (!armedTrack) {
            toast('Selecteer een track voor opname (klik R)', 'error');
            return;
        }

        const ok = await this.engine.startRecording(armedTrack.id);
        if (ok) {
            state.transport.state = 'recording';
            this.engine.play();
            this._updateTransportUI();
            toast('Opname gestart...', 'info');
        }
    }

    async _finishRecording() {
        const blob = await this.engine.stopRecording();
        if (!blob) return;

        const armedTrack = state.tracks.find(t => t.armed);
        if (!armedTrack) return;

        // Convert WebM to AudioBuffer for playback
        const arrayBuffer = await blob.arrayBuffer();
        try {
            const audioBuffer = await this.engine.ctx.decodeAudioData(arrayBuffer);
            const soundId = uuid();
            this.engine.audioBuffers.set(soundId, audioBuffer);

            const peaks = this.engine.computePeaks(audioBuffer);
            const region = {
                id: uuid(),
                soundId,
                startBeat: secondsToBeats(state.transport.position - audioBuffer.duration),
                offset: 0,
                duration: audioBuffer.duration,
                name: 'Opname ' + new Date().toLocaleTimeString(),
                peaks
            };
            armedTrack.regions.push(region);
            toast('Opname opgeslagen', 'success');
        } catch (e) {
            toast('Opname verwerking mislukt', 'error');
        }
    }

    toggleLoop() {
        state.transport.loopEnabled = !state.transport.loopEnabled;
        this._updateTransportUI();
    }

    toggleMetronome() {
        state.transport.metronomeEnabled = !state.transport.metronomeEnabled;
        this._updateTransportUI();
    }

    skipToStart() {
        state.transport.position = 0;
    }

    skipToEnd() {
        let maxBeat = 0;
        state.tracks.forEach(t => t.regions.forEach(r => {
            const end = r.startBeat + secondsToBeats(r.duration);
            if (end > maxBeat) maxBeat = end;
        }));
        state.transport.position = beatsToSeconds(maxBeat);
    }

    // Track controls
    toggleMute(trackId) {
        const track = state.tracks.find(t => t.id === trackId);
        if (track) {
            track.mute = !track.mute;
            this.engine.setTrackVolume(trackId, track.mute ? 0 : track.volume);
            this._renderTrackHeaders();
            this._renderMixer();
        }
    }

    toggleSolo(trackId) {
        const track = state.tracks.find(t => t.id === trackId);
        if (track) {
            track.solo = !track.solo;
            // Solo logic: mute all non-soloed tracks
            const hasSolo = state.tracks.some(t => t.solo);
            state.tracks.forEach(t => {
                const shouldPlay = !hasSolo || t.solo;
                this.engine.setTrackVolume(t.id, (t.mute || !shouldPlay) ? 0 : t.volume);
            });
            this._renderTrackHeaders();
            this._renderMixer();
        }
    }

    toggleArm(trackId) {
        const track = state.tracks.find(t => t.id === trackId);
        if (track) {
            // Only one track can be armed at a time
            state.tracks.forEach(t => t.armed = false);
            track.armed = !track.armed;
            this._renderTrackHeaders();
        }
    }

    setTrackVolume(trackId, value) {
        const track = state.tracks.find(t => t.id === trackId);
        if (track) {
            track.volume = value;
            if (!track.mute) this.engine.setTrackVolume(trackId, value);
        }
    }

    setTrackPan(trackId, value) {
        const track = state.tracks.find(t => t.id === trackId);
        if (track) {
            track.pan = value;
            this.engine.setTrackPan(trackId, value);
        }
    }

    // File handling
    async handleFileUpload(files) {
        for (const file of files) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (!['wav', 'mp3', 'ogg', 'flac', 'webm'].includes(ext)) {
                toast(`Ongeldig formaat: ${file.name}`, 'error');
                continue;
            }

            try {
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await this.engine.ctx.decodeAudioData(arrayBuffer);
                const soundId = uuid();
                this.engine.audioBuffers.set(soundId, audioBuffer);
                const peaks = this.engine.computePeaks(audioBuffer);

                // Add to selected track or first track
                const track = state.tracks.find(t => t.id === state.selectedTrackId) || state.tracks[0];
                if (track) {
                    // Find empty spot
                    let startBeat = 0;
                    track.regions.forEach(r => {
                        const end = r.startBeat + secondsToBeats(r.duration);
                        if (end > startBeat) startBeat = end;
                    });
                    startBeat = snapBeat(startBeat);

                    const region = {
                        id: uuid(),
                        soundId,
                        startBeat,
                        offset: 0,
                        duration: audioBuffer.duration,
                        name: file.name.replace(/\.[^.]+$/, ''),
                        peaks
                    };
                    track.regions.push(region);
                    toast(`${file.name} toegevoegd aan ${track.name}`, 'success');
                }
            } catch (e) {
                toast(`Fout bij laden: ${file.name}`, 'error');
                console.error(e);
            }
        }
    }

    // Export
    async exportProject() {
        toast('Bezig met exporteren...', 'info');
        try {
            const wavBlob = await this.engine.bounce();
            const url = URL.createObjectURL(wavBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${state.project.name}.wav`;
            a.click();
            URL.revokeObjectURL(url);
            toast('Export voltooid!', 'success');
        } catch (e) {
            toast('Export mislukt: ' + e.message, 'error');
        }
    }

    // ---- UI Rendering ----

    _renderTrackHeaders() {
        const container = document.getElementById('track-headers-list');
        container.innerHTML = state.tracks.map(track => {
            const isMidi = track.type === 'midi';
            const typeLabel = isMidi ? 'MIDI' : 'AUD';
            const typeColor = isMidi ? 'var(--purple)' : 'var(--accent-dim)';
            return `
            <div class="track-header ${track.id === state.selectedTrackId ? 'selected' : ''}"
                 data-track-id="${track.id}" onclick="daw.selectTrack('${track.id}')"
                 ${isMidi ? `ondblclick="daw.openPianoRoll('${track.id}')"` : ''}>
                <div class="track-header-top">
                    <div class="track-color" style="background:${track.color}"></div>
                    <span style="font-size:8px;padding:1px 3px;border-radius:2px;background:${typeColor};color:#fff;font-weight:600">${typeLabel}</span>
                    <input class="track-name" value="${track.name}" spellcheck="false"
                           onchange="state.tracks.find(t=>t.id==='${track.id}').name=this.value; daw._renderMixer()"
                           onclick="event.stopPropagation()">
                    <button class="track-delete" onclick="event.stopPropagation(); daw.removeTrack('${track.id}')">&times;</button>
                </div>
                <div class="track-controls">
                    <button class="track-btn ${track.mute ? 'mute-active' : ''}"
                            onclick="event.stopPropagation(); daw.toggleMute('${track.id}')">M</button>
                    <button class="track-btn ${track.solo ? 'solo-active' : ''}"
                            onclick="event.stopPropagation(); daw.toggleSolo('${track.id}')">S</button>
                    <button class="track-btn ${track.armed ? 'arm-active' : ''}"
                            onclick="event.stopPropagation(); daw.toggleArm('${track.id}')">R</button>
                    <input type="range" class="track-volume" min="0" max="1" step="0.01"
                           value="${track.volume}"
                           oninput="daw.setTrackVolume('${track.id}', parseFloat(this.value))"
                           onclick="event.stopPropagation()">
                </div>
            </div>`;
        }).join('');
    }

    _renderMixer() {
        const container = document.getElementById('mixer');
        let html = '';

        // Track channels
        state.tracks.forEach(track => {
            html += `
                <div class="mixer-channel" data-track-id="${track.id}">
                    <div class="mixer-label" style="color:${track.color}">${track.name}</div>
                    <div class="mixer-meter"><div class="mixer-meter-fill" data-meter="${track.id}" style="height:0%"></div></div>
                    <input type="range" class="mixer-fader" min="0" max="1" step="0.01"
                           value="${track.volume}"
                           oninput="daw.setTrackVolume('${track.id}', parseFloat(this.value))">
                    <div class="mixer-knob-container">
                        <div class="mixer-knob" title="Pan: ${track.pan.toFixed(1)}"
                             style="--rotation: ${track.pan * 135}deg"></div>
                        <div class="mixer-knob-label">Pan</div>
                    </div>
                    <div class="mixer-buttons">
                        <button class="track-btn ${track.mute ? 'mute-active' : ''}"
                                onclick="daw.toggleMute('${track.id}')">M</button>
                        <button class="track-btn ${track.solo ? 'solo-active' : ''}"
                                onclick="daw.toggleSolo('${track.id}')">S</button>
                    </div>
                </div>
            `;
        });

        // Master channel
        html += `
            <div class="mixer-channel master">
                <div class="mixer-label">MASTER</div>
                <div class="mixer-meter"><div class="mixer-meter-fill" data-meter="master" style="height:0%"></div></div>
                <input type="range" class="mixer-fader" min="0" max="1" step="0.01"
                       value="${state.mixer.masterVolume}"
                       oninput="state.mixer.masterVolume=parseFloat(this.value); daw.engine.setMasterVolume(parseFloat(this.value))">
                <div class="mixer-knob-container">
                    <div class="mixer-knob"></div>
                    <div class="mixer-knob-label">Pan</div>
                </div>
                <div class="mixer-buttons"></div>
            </div>
        `;

        container.innerHTML = html;
    }

    _updateTransportUI() {
        document.getElementById('btn-play').classList.toggle('active',
            state.transport.state === 'playing');
        document.getElementById('btn-record').classList.toggle('active',
            state.transport.state === 'recording');
        document.getElementById('btn-loop').classList.toggle('active',
            state.transport.loopEnabled);
        document.getElementById('btn-metronome').classList.toggle('active',
            state.transport.metronomeEnabled);
    }

    _startMeterAnimation() {
        const animate = () => {
            if (state.transport.state === 'playing' || state.transport.state === 'recording') {
                // Update track meters
                state.tracks.forEach(track => {
                    const level = this.engine.getMeterLevel(track.id);
                    const el = document.querySelector(`[data-meter="${track.id}"]`);
                    if (el) {
                        const db = Math.max(0, (1 + Math.log10(Math.max(level.left, 0.0001)) / 2));
                        el.style.height = (db * 100) + '%';
                    }
                });

                // Master meter
                const masterLevel = this.engine.getMasterLevel();
                const masterEl = document.querySelector('[data-meter="master"]');
                if (masterEl) {
                    const db = Math.max(0, (1 + Math.log10(Math.max(masterLevel.left, 0.0001)) / 2));
                    masterEl.style.height = (db * 100) + '%';
                }
            } else {
                // Decay meters when stopped
                document.querySelectorAll('.mixer-meter-fill').forEach(el => {
                    const h = parseFloat(el.style.height) || 0;
                    if (h > 0) el.style.height = Math.max(0, h - 2) + '%';
                });
            }
            this.meterAnimFrame = requestAnimationFrame(animate);
        };
        animate();
    }

    // ---- Events ----
    _bindEvents() {
        // Transport buttons
        document.getElementById('btn-play').addEventListener('click', () => this.togglePlay());
        document.getElementById('btn-stop').addEventListener('click', () => this.stop());
        document.getElementById('btn-record').addEventListener('click', () => this.toggleRecord());
        document.getElementById('btn-loop').addEventListener('click', () => this.toggleLoop());
        document.getElementById('btn-metronome').addEventListener('click', () => this.toggleMetronome());
        document.getElementById('btn-skip-back').addEventListener('click', () => this.skipToStart());
        document.getElementById('btn-skip-end').addEventListener('click', () => this.skipToEnd());

        // BPM
        document.getElementById('bpm-input').addEventListener('change', e => {
            state.project.bpm = Math.max(20, Math.min(300, parseInt(e.target.value) || 120));
            e.target.value = state.project.bpm;
        });

        // Time signature
        document.getElementById('timesig-num').addEventListener('change', e => {
            state.project.timeSigNum = parseInt(e.target.value) || 4;
        });
        document.getElementById('timesig-den').addEventListener('change', e => {
            state.project.timeSigDen = parseInt(e.target.value) || 4;
        });

        // Project name
        document.getElementById('project-name').addEventListener('change', e => {
            state.project.name = e.target.value;
        });

        // Add track
        document.getElementById('add-track-btn').addEventListener('click', () => {
            this.showAddTrackDialog();
        });

        // Bottom tabs
        document.querySelectorAll('.bottom-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.bottom-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const panel = tab.dataset.panel;
                document.getElementById('mixer').style.display = panel === 'mixer' ? 'flex' : 'none';
                document.getElementById('instruments').classList.toggle('active', panel === 'instruments');
                document.getElementById('synth-panel').classList.toggle('active', panel === 'synth');
                document.getElementById('sound-match').classList.toggle('active', panel === 'sound-match');
                document.getElementById('library').classList.toggle('active', panel === 'library');
                state.ui.bottomPanel = panel;
            });
        });

        // Bottom panel resize
        let resizing = false;
        const resizeHandle = document.getElementById('bottom-resize');
        resizeHandle.addEventListener('mousedown', e => {
            resizing = true;
            e.preventDefault();
        });
        document.addEventListener('mousemove', e => {
            if (!resizing) return;
            const newHeight = window.innerHeight - e.clientY;
            state.ui.bottomPanelHeight = Math.max(100, Math.min(400, newHeight));
            document.getElementById('bottom-panel').style.height = state.ui.bottomPanelHeight + 'px';
        });
        document.addEventListener('mouseup', () => resizing = false);

        // File upload
        document.getElementById('btn-upload').addEventListener('click', () => {
            document.getElementById('file-upload').click();
        });
        document.getElementById('file-upload').addEventListener('change', e => {
            if (e.target.files.length) this.handleFileUpload(e.target.files);
            e.target.value = '';
        });

        // Export
        document.getElementById('btn-export').addEventListener('click', () => this.exportProject());

        // Save
        document.getElementById('btn-save').addEventListener('click', () => {
            toast('Project opgeslagen (lokaal)', 'success');
        });

        // Timeline click (set playhead position)
        document.getElementById('timeline-canvas').addEventListener('click', e => {
            if (state.transport.state === 'playing') return;
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX - rect.left + document.getElementById('timeline-scroll').scrollLeft;
            const beat = pixelsToBeats(x);
            state.transport.position = beatsToSeconds(snapBeat(beat));
        });

        // Ruler click
        document.getElementById('ruler-canvas').addEventListener('click', e => {
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX - rect.left + document.getElementById('timeline-scroll').scrollLeft;
            const beat = pixelsToBeats(x);
            state.transport.position = beatsToSeconds(snapBeat(beat));
        });

        // Drag & drop files onto timeline
        const timelineArea = document.getElementById('timeline-area');
        timelineArea.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        });
        timelineArea.addEventListener('drop', e => {
            e.preventDefault();
            if (e.dataTransfer.files.length) {
                this.handleFileUpload(e.dataTransfer.files);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            // Don't trigger when typing in inputs
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

            // Route to instrument/synth panel when active
            if (state.ui.bottomPanel === 'instruments' && !e.ctrlKey && !e.metaKey) {
                if (this.instruments.handleKeyDown(e.code)) { e.preventDefault(); return; }
            }
            if (state.ui.bottomPanel === 'synth' && !e.ctrlKey && !e.metaKey) {
                if (this.synth.handleKeyDown(e.code)) { e.preventDefault(); return; }
            }

            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    this.togglePlay();
                    break;
                case 'Enter':
                    this.stop();
                    break;
                case 'KeyR':
                    if (e.ctrlKey || e.metaKey) break;
                    if (state.selectedTrackId) this.toggleArm(state.selectedTrackId);
                    break;
                case 'KeyM':
                    if (state.selectedTrackId) this.toggleMute(state.selectedTrackId);
                    break;
                case 'KeyS':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toast('Project opgeslagen', 'success');
                    } else {
                        if (state.selectedTrackId) this.toggleSolo(state.selectedTrackId);
                    }
                    break;
                case 'KeyL':
                    this.toggleLoop();
                    break;
                case 'KeyK':
                    this.toggleMetronome();
                    break;
                case 'Home':
                    this.skipToStart();
                    break;
                case 'End':
                    this.skipToEnd();
                    break;
                case 'Delete':
                case 'Backspace':
                    if (state.selectedRegionId) {
                        state.tracks.forEach(t => {
                            t.regions = t.regions.filter(r => r.id !== state.selectedRegionId);
                        });
                        state.selectedRegionId = null;
                    }
                    break;
                case 'Equal':
                case 'NumpadAdd':
                    state.timeline.pixelsPerBeat = Math.min(200, state.timeline.pixelsPerBeat * 1.2);
                    this.renderer.resize();
                    break;
                case 'Minus':
                case 'NumpadSubtract':
                    state.timeline.pixelsPerBeat = Math.max(5, state.timeline.pixelsPerBeat / 1.2);
                    this.renderer.resize();
                    break;
            }
        });

        // Zoom with Ctrl+wheel
        document.getElementById('timeline-scroll').addEventListener('wheel', e => {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const factor = e.deltaY < 0 ? 1.1 : 0.9;
                state.timeline.pixelsPerBeat = Math.max(5, Math.min(200,
                    state.timeline.pixelsPerBeat * factor));
                this.renderer.resize();
            }
        }, { passive: false });

        // Keyup for instrument/synth note release
        document.addEventListener('keyup', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
            if (state.ui.bottomPanel === 'instruments') this.instruments.handleKeyUp(e.code);
            if (state.ui.bottomPanel === 'synth') this.synth.handleKeyUp(e.code);
        });

        // Init audio context on first user interaction
        document.addEventListener('click', () => this.engine.resume(), { once: true });
    }

    _bindInstrumentEvents() {
        document.getElementById('instrument-select').addEventListener('change', async e => {
            await this.instruments.setInstrument(e.target.value);
        });
        document.getElementById('octave-down').addEventListener('click', () => {
            this.instruments.octave = Math.max(0, this.instruments.octave - 1);
            this.instruments._updateUI();
            if (!this.instruments.isDrumMode) this.instruments._renderPianoKeyboard();
        });
        document.getElementById('octave-up').addEventListener('click', () => {
            this.instruments.octave = Math.min(8, this.instruments.octave + 1);
            this.instruments._updateUI();
            if (!this.instruments.isDrumMode) this.instruments._renderPianoKeyboard();
        });
    }

    // ---- Piano Roll Editor ----
    openPianoRoll(trackId) {
        const track = state.tracks.find(t => t.id === trackId);
        if (!track || track.type !== 'midi') return;

        // Create or get first MIDI region
        let region = track.regions[0];
        if (!region) {
            region = {
                id: uuid(),
                startBeat: 0,
                lengthBeats: 8,
                name: 'Pattern 1',
                notes: []
            };
            track.regions.push(region);
        }

        // Build piano roll modal
        const overlay = document.createElement('div');
        overlay.id = 'piano-roll-overlay';

        const noteNames = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
        const minOct = 2, maxOct = 7;
        const totalNotes = (maxOct - minOct + 1) * 12;
        const noteH = 14;
        const beatW = 40;
        const totalBeats = region.lengthBeats || 8;
        const canvasW = totalBeats * beatW;
        const canvasH = totalNotes * noteH;

        // Build keys HTML
        let keysHtml = '';
        for (let oct = maxOct; oct >= minOct; oct--) {
            for (let n = 11; n >= 0; n--) {
                const name = `${noteNames[n]}${oct}`;
                const isBlack = [1,3,6,8,10].includes(n);
                const isC = n === 0;
                keysHtml += `<div class="pr-key ${isBlack ? 'black' : 'white'} ${isC ? 'c-note' : ''}"
                    data-note="${name}" onmousedown="daw._prPreviewNote('${name}')">${isC ? name : (isBlack ? '' : noteNames[n])}</div>`;
            }
        }

        overlay.innerHTML = `
            <div id="piano-roll">
                <div id="piano-roll-header">
                    <h3>${track.name} — ${region.name}</h3>
                    <div class="header-control">
                        <label>Lengte (beats)</label>
                        <input type="number" class="header-input" id="pr-length" value="${totalBeats}" min="1" max="64" style="width:50px">
                    </div>
                    <div class="header-control">
                        <label>Grid</label>
                        <select class="header-input" id="pr-grid" style="width:auto">
                            <option value="1">1 beat</option>
                            <option value="0.5">1/2 beat</option>
                            <option value="0.25" selected>1/4 beat</option>
                            <option value="0.125">1/8 beat</option>
                        </select>
                    </div>
                    <button class="header-btn" onclick="daw._prClear()">Wissen</button>
                    <button class="modal-btn primary" id="pr-close">Sluiten</button>
                </div>
                <div id="piano-roll-body">
                    <div id="piano-roll-keys" style="overflow-y:hidden">${keysHtml}</div>
                    <div id="piano-roll-grid-container">
                        <canvas id="piano-roll-canvas" width="${canvasW}" height="${canvasH}"></canvas>
                    </div>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);

        // Sync scroll
        const gridContainer = overlay.querySelector('#piano-roll-grid-container');
        const keysDiv = overlay.querySelector('#piano-roll-keys');
        gridContainer.addEventListener('scroll', () => {
            keysDiv.scrollTop = gridContainer.scrollTop;
        });

        // Store piano roll state
        this._prState = { track, region, overlay, noteH, beatW, totalNotes, minOct, maxOct, noteNames, gridSnap: 0.25 };

        // Initial render + scroll to middle
        this._prRender();
        gridContainer.scrollTop = (canvasH / 2) - 100;

        // Canvas click to add/remove notes
        const canvas = overlay.querySelector('#piano-roll-canvas');
        canvas.addEventListener('mousedown', e => this._prMouseDown(e));

        // Length change
        overlay.querySelector('#pr-length').addEventListener('change', e => {
            region.lengthBeats = Math.max(1, parseInt(e.target.value) || 8);
            canvas.width = region.lengthBeats * beatW;
            this._prRender();
        });

        // Grid change
        overlay.querySelector('#pr-grid').addEventListener('change', e => {
            this._prState.gridSnap = parseFloat(e.target.value);
        });

        // Close
        overlay.querySelector('#pr-close').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    }

    _prRender() {
        const s = this._prState;
        if (!s) return;
        const canvas = document.getElementById('piano-roll-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        // Background rows (alternating for black/white keys)
        for (let i = 0; i < s.totalNotes; i++) {
            const noteIdx = 11 - (i % 12);
            const isBlack = [1,3,6,8,10].includes(noteIdx);
            const isC = noteIdx === 0;
            ctx.fillStyle = isBlack ? '#151520' : '#1c1c2a';
            ctx.fillRect(0, i * s.noteH, w, s.noteH);
            if (isC) {
                ctx.fillStyle = '#2a2a44';
                ctx.fillRect(0, i * s.noteH, w, 1);
            }
        }

        // Vertical grid lines (beats)
        const beats = s.region.lengthBeats || 8;
        for (let b = 0; b <= beats; b++) {
            const x = b * s.beatW;
            const isBar = b % state.project.timeSigNum === 0;
            ctx.strokeStyle = isBar ? '#444466' : '#2a2a3e';
            ctx.lineWidth = isBar ? 1 : 0.5;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
            ctx.stroke();

            // Sub-grid
            if (s.gridSnap < 1) {
                const steps = 1 / s.gridSnap;
                for (let sub = 1; sub < steps; sub++) {
                    const sx = x + (sub * s.gridSnap * s.beatW);
                    ctx.strokeStyle = '#1e1e30';
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(sx, 0);
                    ctx.lineTo(sx, h);
                    ctx.stroke();
                }
            }
        }

        // Draw notes
        const color = s.track.color || '#4a7fff';
        s.region.notes.forEach(note => {
            const midi = this.renderer._noteNameToMidi(note.note);
            const rowFromTop = (s.maxOct * 12 + 11) - midi;
            const y = rowFromTop * s.noteH;
            const x = note.startBeat * s.beatW;
            const w2 = Math.max(4, note.lengthBeats * s.beatW - 1);

            // Note block
            const vel = (note.velocity || 100) / 127;
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.5 + vel * 0.5;
            ctx.fillRect(x, y + 1, w2, s.noteH - 2);
            ctx.globalAlpha = 1;

            // Border
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y + 1, w2, s.noteH - 2);
        });
    }

    _prMouseDown(e) {
        const s = this._prState;
        if (!s) return;
        const canvas = e.target;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const beat = Math.floor(x / s.beatW / s.gridSnap) * s.gridSnap;
        const rowFromTop = Math.floor(y / s.noteH);
        const midi = (s.maxOct * 12 + 11) - rowFromTop;
        const noteIdx = midi % 12;
        const octave = Math.floor(midi / 12) - 1;
        const noteName = `${s.noteNames[noteIdx]}${octave}`;

        // Check if clicking existing note → remove it
        const existing = s.region.notes.findIndex(n =>
            n.note === noteName &&
            beat >= n.startBeat &&
            beat < n.startBeat + n.lengthBeats
        );

        if (existing >= 0) {
            s.region.notes.splice(existing, 1);
        } else {
            // Add new note
            s.region.notes.push({
                note: noteName,
                startBeat: beat,
                lengthBeats: s.gridSnap,
                velocity: 100
            });
            // Preview the note
            this._prPreviewNote(noteName);
        }

        this._prRender();
    }

    _prPreviewNote(noteName) {
        const track = this._prState?.track;
        if (!track) return;
        // Use instrument engine to play
        if (track.instrument && this.instruments) {
            this.instruments.playNote(noteName);
            setTimeout(() => this.instruments.stopNote(noteName), 300);
        }
    }

    _prClear() {
        if (this._prState?.region) {
            this._prState.region.notes = [];
            this._prRender();
        }
    }

    // ---- MIDI Playback ----
    _scheduleMidiRegion(track, region, startTime) {
        if (!region.notes || !track.instrument) return;
        const nodes = this.engine.trackNodes.get(track.id);
        if (!nodes) return;

        region.notes.forEach(note => {
            const noteStartSec = beatsToSeconds(region.startBeat + note.startBeat);
            const noteDurSec = beatsToSeconds(note.lengthBeats);

            // Schedule via instrument engine soundfont
            const buffers = this.instruments?.loadedInstruments?.get(track.instrument);
            if (buffers && buffers[note.note]) {
                const when = startTime + noteStartSec;
                if (when < this.engine.ctx.currentTime) return; // Already passed

                const source = this.engine.ctx.createBufferSource();
                source.buffer = buffers[note.note];
                const noteGain = this.engine.ctx.createGain();
                noteGain.gain.value = (note.velocity || 100) / 127 * 0.6;
                source.connect(noteGain);
                noteGain.connect(nodes.gain);

                source.start(when);
                // Fade out at note end
                noteGain.gain.setValueAtTime((note.velocity || 100) / 127 * 0.6, when + noteDurSec - 0.02);
                noteGain.gain.linearRampToValueAtTime(0, when + noteDurSec);
                source.stop(when + noteDurSec + 0.05);

                const key = `midi_${note.note}_${when}`;
                this.engine.activeSources.set(key, source);
                source.onended = () => this.engine.activeSources.delete(key);
            }
        });
    }

    _bindSoundMatchEvents() {
        const dropZone = document.getElementById('match-drop-zone');
        const fileInput = document.getElementById('match-file-input');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) this._analyzeMatchFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', e => {
            if (e.target.files.length) this._analyzeMatchFile(e.target.files[0]);
            e.target.value = '';
        });
    }

    async _analyzeMatchFile(file) {
        const statusEl = document.getElementById('match-status');
        const resultsEl = document.getElementById('match-results');

        statusEl.textContent = `Analyseren: ${file.name}...`;
        resultsEl.innerHTML = '';

        try {
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await this.engine.ctx.decodeAudioData(arrayBuffer);

            // Analyseer reference
            statusEl.textContent = 'Spectrale features extraheren...';
            const refFeatures = this.matcher.analyzeBuffer(audioBuffer);

            // Check of er sounds in de library zijn
            if (this.engine.audioBuffers.size === 0) {
                statusEl.textContent = `Analyse klaar! Spectral centroid: ${Math.round(refFeatures.centroid)}Hz, ` +
                    `Rolloff: ${Math.round(refFeatures.rolloff)}Hz. ` +
                    `Laad eerst geluiden in je library (upload bestanden of gebruik Freesound import) om matches te vinden.`;

                // Toon spectrum van reference
                const canvas = document.createElement('canvas');
                canvas.width = 320; canvas.height = 60;
                canvas.style.borderRadius = '4px';
                canvas.style.marginTop = '8px';
                resultsEl.appendChild(canvas);
                this.matcher.renderSpectrum(canvas, refFeatures);
                return;
            }

            // Match tegen library
            statusEl.textContent = `Vergelijken met ${this.engine.audioBuffers.size} geluiden...`;
            const matches = await this.matcher.matchAgainstLibrary(audioBuffer);

            if (matches.length === 0) {
                statusEl.textContent = 'Geen matches gevonden.';
                return;
            }

            statusEl.textContent = `${matches.length} matches gevonden voor "${file.name}"`;

            // Render results
            resultsEl.innerHTML = matches.map((m, i) => {
                const scoreColor = m.score >= 70 ? '#4aff6a' : m.score >= 40 ? '#ffd24a' : '#ff4a5a';
                return `
                    <div class="match-result" data-sound-id="${m.soundId}">
                        <div class="match-score" style="color:${scoreColor}">${m.score}%</div>
                        <div class="match-info">
                            <div class="match-name">Sound ${i + 1}</div>
                            <div class="match-detail">
                                Centroid: ${Math.round(m.features.centroid)}Hz |
                                Energie: ${m.features.energy.toFixed(4)} |
                                ${m.features.duration.toFixed(1)}s
                            </div>
                        </div>
                        <canvas class="match-spectrum" width="160" height="60" data-match-idx="${i}"></canvas>
                    </div>
                `;
            }).join('');

            // Render spectrum visualizations
            matches.forEach((m, i) => {
                const canvas = resultsEl.querySelector(`[data-match-idx="${i}"]`);
                if (canvas) this.matcher.renderSpectrum(canvas, m.features);
            });

        } catch (e) {
            statusEl.textContent = `Fout: ${e.message}`;
            console.error('Sound match fout:', e);
        }
    }
}

// ---- Initialize ----
let daw;
document.addEventListener('DOMContentLoaded', async () => {
    daw = new DAWController();
    await daw.init();
});
</script>
</body>
