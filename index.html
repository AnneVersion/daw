<script>
/* ============================================================
   DAW Application - Main Script
   ============================================================ */

// ---- Configuration ----
const API_BASE = '';  // Same origin
const TRACK_COLORS = [
    '#4a7fff', '#ff4a5a', '#4aff6a', '#ffd24a', '#ff8a4a',
    '#9a4aff', '#4affd2', '#ff4aaa', '#8aff4a', '#4ad2ff'
];

// ---- State ----
const state = {
    project: {
        id: null,
        name: 'Nieuw Project',
        bpm: 120,
        timeSigNum: 4,
        timeSigDen: 4,
        sampleRate: 44100
    },
    tracks: [],
    selectedTrackId: null,
    selectedRegionId: null,
    transport: {
        state: 'stopped', // stopped, playing, recording, paused
        position: 0,      // seconds
        loopEnabled: false,
        loopStart: 0,
        loopEnd: 8,
        metronomeEnabled: false
    },
    timeline: {
        pixelsPerBeat: 40,
        scrollX: 0,
        scrollY: 0,
        totalBeats: 128,
        snapToGrid: true
    },
    mixer: {
        masterVolume: 1.0
    },
    ui: {
        bottomPanel: 'mixer',
        bottomPanelHeight: 200
    },
    undoStack: [],
    redoStack: []
};

// ---- Utility ----
function uuid() {
    return crypto.randomUUID ? crypto.randomUUID() :
        'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            const r = Math.random() * 16 | 0;
            return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
}

function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toFixed(3).padStart(6, '0')}`;
}

function beatsToSeconds(beats) {
    return (beats / state.project.bpm) * 60;
}

function secondsToBeats(seconds) {
    return (seconds * state.project.bpm) / 60;
}

function pixelsToBeats(px) {
    return px / state.timeline.pixelsPerBeat;
}

function beatsToPixels(beats) {
    return beats * state.timeline.pixelsPerBeat;
}

function snapBeat(beat) {
    if (!state.timeline.snapToGrid) return beat;
    return Math.round(beat * 4) / 4; // snap to 1/4 beat
}

// ---- Audio Engine ----
class AudioEngine {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.masterAnalyser = null;
        this.trackNodes = new Map(); // trackId -> { gain, pan, analyser, meter }
        this.activeSources = new Map(); // regionId -> AudioBufferSourceNode
        this.audioBuffers = new Map(); // soundId -> AudioBuffer
        this.schedulerTimer = null;
        this.scheduleAheadTime = 0.1; // seconds
        this.meterWorkletReady = false;
        this.metronomeGain = null;
        this.recordStream = null;
        this.mediaRecorder = null;
        this.recordChunks = [];
    }

    async init() {
        this.ctx = new AudioContext({ sampleRate: state.project.sampleRate });

        // Master chain
        this.masterGain = this.ctx.createGain();
        this.masterAnalyser = this.ctx.createAnalyser();
        this.masterAnalyser.fftSize = 256;
        this.masterGain.connect(this.masterAnalyser);
        this.masterAnalyser.connect(this.ctx.destination);

        // Metronome
        this.metronomeGain = this.ctx.createGain();
        this.metronomeGain.gain.value = 0.3;
        this.metronomeGain.connect(this.ctx.destination);

        // Try to load meter worklet
        try {
            await this.ctx.audioWorklet.addModule('worklets/meter-processor.js');
            this.meterWorkletReady = true;
        } catch (e) {
            console.warn('AudioWorklet niet beschikbaar, fallback naar AnalyserNode', e);
        }

        console.log('AudioEngine geinitialiseerd', this.ctx.sampleRate, 'Hz');
    }

    async resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
            await this.ctx.resume();
        }
    }

    createTrackNodes(trackId) {
        const gain = this.ctx.createGain();
        const pan = this.ctx.createStereoPanner();
        const analyser = this.ctx.createAnalyser();
        analyser.fftSize = 256;

        gain.connect(pan);
        pan.connect(analyser);
        analyser.connect(this.masterGain);

        let meter = null;
        if (this.meterWorkletReady) {
            meter = new AudioWorkletNode(this.ctx, 'meter-processor');
            pan.connect(meter);
            meter.connect(this.ctx.createGain()); // Dummy output, meter is passthrough
        }

        this.trackNodes.set(trackId, { gain, pan, analyser, meter });
        return { gain, pan, analyser, meter };
    }

    removeTrackNodes(trackId) {
        const nodes = this.trackNodes.get(trackId);
        if (nodes) {
            nodes.gain.disconnect();
            nodes.pan.disconnect();
            nodes.analyser.disconnect();
            if (nodes.meter) nodes.meter.disconnect();
            this.trackNodes.delete(trackId);
        }
    }

    async loadAudioBuffer(url, soundId) {
        if (this.audioBuffers.has(soundId)) return this.audioBuffers.get(soundId);
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
        this.audioBuffers.set(soundId, audioBuffer);
        return audioBuffer;
    }

    play() {
        if (!this.ctx) return;
        this.resume();
        this._startTime = this.ctx.currentTime - state.transport.position;
        this._schedulePlay();
        this.schedulerTimer = setInterval(() => this._schedulePlay(), 25);
    }

    _schedulePlay() {
        const now = this.ctx.currentTime;
        const playPos = now - this._startTime;

        state.tracks.forEach(track => {
            if (track.mute) return;
            track.regions.forEach(region => {
                if (track.type === 'midi') {
                    // MIDI regions: schedule individual notes
                    const regionStart = beatsToSeconds(region.startBeat);
                    const key = 'midi_region_' + region.id;
                    if (regionStart >= playPos && regionStart < playPos + this.scheduleAheadTime) {
                        if (this.activeSources.has(key)) return;
                        this.activeSources.set(key, true); // Mark as scheduled
                        // Delegate to DAW controller for instrument playback
                        if (window.daw) window.daw._scheduleMidiRegion(track, region, this._startTime);
                    }
                } else {
                    // Audio regions
                    const regionStart = beatsToSeconds(region.startBeat);
                    const key = region.id;
                    if (regionStart >= playPos && regionStart < playPos + this.scheduleAheadTime) {
                        if (this.activeSources.has(key)) return;
                        const buffer = this.audioBuffers.get(region.soundId);
                        if (!buffer) return;

                        const source = this.ctx.createBufferSource();
                        source.buffer = buffer;
                        const nodes = this.trackNodes.get(track.id);
                        if (nodes) source.connect(nodes.gain);

                        const when = this._startTime + regionStart;
                        source.start(when, region.offset || 0, region.duration);
                        source.onended = () => this.activeSources.delete(key);
                        this.activeSources.set(key, source);
                    }
                }
            });
        });

        // Metronome
        if (state.transport.metronomeEnabled) {
            this._scheduleMetronome(playPos);
        }

        // Update transport position
        state.transport.position = playPos;

        // Loop check
        if (state.transport.loopEnabled) {
            const loopEndSec = beatsToSeconds(state.transport.loopEnd);
            if (playPos >= loopEndSec) {
                this.stop();
                state.transport.position = beatsToSeconds(state.transport.loopStart);
                this.play();
            }
        }
    }

    _lastMetronomeBeat = -1;
    _scheduleMetronome(playPos) {
        const bps = state.project.bpm / 60;
        const currentBeat = Math.floor(playPos * bps);
        if (currentBeat <= this._lastMetronomeBeat) return;
        this._lastMetronomeBeat = currentBeat;

        const isDownbeat = currentBeat % state.project.timeSigNum === 0;
        const freq = isDownbeat ? 1000 : 800;
        const osc = this.ctx.createOscillator();
        osc.frequency.value = freq;
        osc.connect(this.metronomeGain);
        const beatTime = this._startTime + (currentBeat / bps);
        osc.start(beatTime);
        osc.stop(beatTime + 0.03);
    }

    stop() {
        clearInterval(this.schedulerTimer);
        this.activeSources.forEach(source => {
            try { source.stop(); } catch(e) {}
        });
        this.activeSources.clear();
        this._lastMetronomeBeat = -1;
    }

    pause() {
        if (this.ctx) this.ctx.suspend();
        clearInterval(this.schedulerTimer);
    }

    unpause() {
        if (this.ctx) this.ctx.resume();
        this._startTime = this.ctx.currentTime - state.transport.position;
        this.schedulerTimer = setInterval(() => this._schedulePlay(), 25);
    }

    setTrackVolume(trackId, value) {
        const nodes = this.trackNodes.get(trackId);
        if (nodes) nodes.gain.gain.setTargetAtTime(value, this.ctx.currentTime, 0.01);
    }

    setTrackPan(trackId, value) {
        const nodes = this.trackNodes.get(trackId);
        if (nodes) nodes.pan.pan.setTargetAtTime(value, this.ctx.currentTime, 0.01);
    }

    setMasterVolume(value) {
        if (this.masterGain) {
            this.masterGain.gain.setTargetAtTime(value, this.ctx.currentTime, 0.01);
        }
    }

    getMeterLevel(trackId) {
        const nodes = this.trackNodes.get(trackId);
        if (!nodes) return { left: 0, right: 0 };
        const analyser = nodes.analyser;
        const data = new Float32Array(analyser.frequencyBinCount);
        analyser.getFloatTimeDomainData(data);
        let rms = 0;
        for (let i = 0; i < data.length; i++) rms += data[i] * data[i];
        rms = Math.sqrt(rms / data.length);
        return { left: rms, right: rms };
    }

    getMasterLevel() {
        if (!this.masterAnalyser) return { left: 0, right: 0 };
        const data = new Float32Array(this.masterAnalyser.frequencyBinCount);
        this.masterAnalyser.getFloatTimeDomainData(data);
        let rms = 0;
        for (let i = 0; i < data.length; i++) rms += data[i] * data[i];
        rms = Math.sqrt(rms / data.length);
        return { left: rms, right: rms };
    }

    // Recording
    async startRecording(trackId) {
        try {
            this.recordStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.recordChunks = [];
            this.mediaRecorder = new MediaRecorder(this.recordStream, { mimeType: 'audio/webm' });
            this.mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) this.recordChunks.push(e.data);
            };
            this.mediaRecorder.start(100);
            return true;
        } catch (e) {
            console.error('Opname fout:', e);
            toast('Kan microfoon niet openen: ' + e.message, 'error');
            return false;
        }
    }

    async stopRecording() {
        return new Promise(resolve => {
            if (!this.mediaRecorder) { resolve(null); return; }
            this.mediaRecorder.onstop = async () => {
                const blob = new Blob(this.recordChunks, { type: 'audio/webm' });
                this.recordStream.getTracks().forEach(t => t.stop());
                this.recordStream = null;
                this.mediaRecorder = null;
                resolve(blob);
            };
            this.mediaRecorder.stop();
        });
    }

    // Waveform peak computation
    computePeaks(audioBuffer, numPeaks = 800) {
        const channelData = audioBuffer.getChannelData(0);
        const blockSize = Math.floor(channelData.length / numPeaks);
        const peaks = [];
        for (let i = 0; i < numPeaks; i++) {
            let min = 1, max = -1;
            const start = i * blockSize;
            for (let j = 0; j < blockSize; j++) {
                const val = channelData[start + j] || 0;
                if (val < min) min = val;
                if (val > max) max = val;
            }
            peaks.push([min, max]);
        }
        return peaks;
    }

    // Export / bounce
    async bounce() {
        const totalBeats = state.timeline.totalBeats;
        const totalSeconds = beatsToSeconds(totalBeats);
        const offlineCtx = new OfflineAudioContext(2, totalSeconds * state.project.sampleRate, state.project.sampleRate);

        const masterGain = offlineCtx.createGain();
        masterGain.gain.value = state.mixer.masterVolume;
        masterGain.connect(offlineCtx.destination);

        for (const track of state.tracks) {
            if (track.mute) continue;
            const gain = offlineCtx.createGain();
            gain.gain.value = track.volume;
            const pan = offlineCtx.createStereoPanner();
            pan.pan.value = track.pan;
            gain.connect(pan);
            pan.connect(masterGain);

            for (const region of track.regions) {
                const buffer = this.audioBuffers.get(region.soundId);
                if (!buffer) continue;
                const source = offlineCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(gain);
                const startSec = beatsToSeconds(region.startBeat);
                source.start(startSec, region.offset || 0, region.duration);
            }
        }

        const renderedBuffer = await offlineCtx.startRendering();
        return this._audioBufferToWav(renderedBuffer);
    }

    _audioBufferToWav(buffer) {
        const numChannels = buffer.numberOfChannels;
        const sampleRate = buffer.sampleRate;
        const format = 1; // PCM
        const bitDepth = 16;
        const bytesPerSample = bitDepth / 8;
        const blockAlign = numChannels * bytesPerSample;
        const dataSize = buffer.length * blockAlign;
        const headerSize = 44;
        const arrayBuffer = new ArrayBuffer(headerSize + dataSize);
        const view = new DataView(arrayBuffer);

        const writeString = (offset, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };

        writeString(0, 'RIFF');
        view.setUint32(4, 36 + dataSize, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, format, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * blockAlign, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitDepth, true);
        writeString(36, 'data');
        view.setUint32(40, dataSize, true);

        const channels = [];
        for (let ch = 0; ch < numChannels; ch++) channels.push(buffer.getChannelData(ch));

        let offset = 44;
        for (let i = 0; i < buffer.length; i++) {
            for (let ch = 0; ch < numChannels; ch++) {
                const sample = Math.max(-1, Math.min(1, channels[ch][i]));
                view.setInt16(offset, sample * 0x7FFF, true);
                offset += 2;
            }
        }

        return new Blob([arrayBuffer], { type: 'audio/wav' });
    }
}

// ---- Timeline Renderer ----
class TimelineRenderer {
    constructor(canvas, rulerCanvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.rulerCanvas = rulerCanvas;
        this.rulerCtx = rulerCanvas.getContext('2d');
        this.dpr = window.devicePixelRatio || 1;
        this._animFrame = null;
    }

    resize() {
        const parent = this.canvas.parentElement;
        const w = parent.clientWidth;
        const totalH = state.tracks.length * parseInt(getComputedStyle(document.documentElement).getPropertyValue('--track-height'));
        const h = Math.max(parent.clientHeight, totalH);
        const totalW = beatsToPixels(state.timeline.totalBeats);

        this.canvas.width = Math.max(w, totalW) * this.dpr;
        this.canvas.height = h * this.dpr;
        this.canvas.style.width = Math.max(w, totalW) + 'px';
        this.canvas.style.height = h + 'px';
        this.ctx.scale(this.dpr, this.dpr);

        // Ruler
        this.rulerCanvas.width = this.rulerCanvas.parentElement.clientWidth * this.dpr;
        this.rulerCanvas.height = 28 * this.dpr;
        this.rulerCanvas.style.width = '100%';
        this.rulerCanvas.style.height = '28px';
        this.rulerCtx.scale(this.dpr, this.dpr);
    }

    render() {
        const w = this.canvas.width / this.dpr;
        const h = this.canvas.height / this.dpr;
        const ctx = this.ctx;
        const trackHeight = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--track-height'));
        const ppb = state.timeline.pixelsPerBeat;
        const scrollX = document.getElementById('timeline-scroll').scrollLeft;

        ctx.clearRect(0, 0, w, h);

        // ---- Grid ----
        const startBeat = Math.floor(scrollX / ppb);
        const endBeat = Math.ceil((scrollX + w) / ppb) + 1;

        for (let beat = startBeat; beat < endBeat && beat < state.timeline.totalBeats; beat++) {
            const x = beat * ppb;
            const isBar = beat % state.project.timeSigNum === 0;

            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
            ctx.strokeStyle = isBar ? '#333348' : '#222235';
            ctx.lineWidth = isBar ? 1 : 0.5;
            ctx.stroke();
        }

        // ---- Track backgrounds ----
        state.tracks.forEach((track, i) => {
            const y = i * trackHeight;
            ctx.fillStyle = i % 2 === 0 ? '#1e1e2e' : '#222235';
            ctx.fillRect(0, y, w, trackHeight);

            // Track separator
            ctx.fillStyle = '#333348';
            ctx.fillRect(0, y + trackHeight - 1, w, 1);
        });

        // ---- Regions (waveforms + MIDI) ----
        state.tracks.forEach((track, trackIndex) => {
            const trackY = trackIndex * trackHeight;
            const isMidi = track.type === 'midi';

            track.regions.forEach(region => {
                const x = beatsToPixels(region.startBeat);
                const regionW = isMidi ?
                    beatsToPixels(region.lengthBeats || 4) :
                    beatsToPixels(secondsToBeats(region.duration));
                const y = trackY + 4;
                const regionH = trackHeight - 8;

                // Region background
                const color = track.color || TRACK_COLORS[trackIndex % TRACK_COLORS.length];
                ctx.fillStyle = color + '30';
                ctx.strokeStyle = color + '80';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(x, y, regionW, regionH, 3);
                ctx.fill();
                ctx.stroke();

                if (isMidi && region.notes && region.notes.length > 0) {
                    // ---- MIDI: draw note blocks ----
                    // Find note range for scaling
                    let minNote = 127, maxNote = 0;
                    region.notes.forEach(n => {
                        const midi = this._noteNameToMidi(n.note);
                        if (midi < minNote) minNote = midi;
                        if (midi > maxNote) maxNote = midi;
                    });
                    const noteRange = Math.max(maxNote - minNote, 12) + 4;
                    const noteH = Math.max(2, (regionH - 14) / noteRange);

                    ctx.fillStyle = color + 'dd';
                    region.notes.forEach(n => {
                        const midi = this._noteNameToMidi(n.note);
                        const noteX = x + (n.startBeat / (region.lengthBeats || 4)) * regionW;
                        const noteW = Math.max(2, (n.lengthBeats / (region.lengthBeats || 4)) * regionW);
                        const noteY = y + regionH - 4 - (midi - minNote + 2) * noteH;
                        ctx.fillRect(noteX, noteY, noteW - 0.5, noteH - 0.5);
                    });
                } else if (!isMidi && region.peaks && region.peaks.length > 0) {
                    // ---- Audio: draw waveform ----
                    const peaks = region.peaks;
                    const centerY = y + regionH / 2;
                    const amp = regionH / 2 - 2;

                    ctx.fillStyle = color + 'cc';
                    ctx.beginPath();
                    for (let i = 0; i < peaks.length; i++) {
                        const px = x + (i / peaks.length) * regionW;
                        const top = centerY + peaks[i][0] * amp;
                        if (i === 0) ctx.moveTo(px, top);
                        else ctx.lineTo(px, top);
                    }
                    for (let i = peaks.length - 1; i >= 0; i--) {
                        const px = x + (i / peaks.length) * regionW;
                        const bottom = centerY + peaks[i][1] * amp;
                        ctx.lineTo(px, bottom);
                    }
                    ctx.closePath();
                    ctx.fill();
                }

                // Region name
                ctx.fillStyle = '#ffffff';
                ctx.font = '10px -apple-system, sans-serif';
                ctx.fillText(region.name || '', x + 4, y + 12);

                // Selected highlight
                if (region.id === state.selectedRegionId) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(x, y, regionW, regionH, 3);
                    ctx.stroke();
                }
            });
        });

        // ---- Loop region ----
        if (state.transport.loopEnabled) {
            const lx1 = beatsToPixels(state.transport.loopStart);
            const lx2 = beatsToPixels(state.transport.loopEnd);
            ctx.fillStyle = 'rgba(74, 127, 255, 0.08)';
            ctx.fillRect(lx1, 0, lx2 - lx1, h);
            ctx.fillStyle = 'rgba(74, 127, 255, 0.3)';
            ctx.fillRect(lx1, 0, 2, h);
            ctx.fillRect(lx2 - 2, 0, 2, h);
        }

        // ---- Ruler ----
        this._renderRuler(scrollX);
    }

    _renderRuler(scrollX) {
        const rw = this.rulerCanvas.width / this.dpr;
        const rh = 28;
        const rctx = this.rulerCtx;
        const ppb = state.timeline.pixelsPerBeat;

        rctx.clearRect(0, 0, rw, rh);
        rctx.fillStyle = '#12121a';
        rctx.fillRect(0, 0, rw, rh);

        const startBeat = Math.floor(scrollX / ppb);
        const endBeat = Math.ceil((scrollX + rw) / ppb) + 1;

        for (let beat = startBeat; beat < endBeat; beat++) {
            const x = beat * ppb - scrollX;
            const isBar = beat % state.project.timeSigNum === 0;

            if (isBar) {
                const barNum = Math.floor(beat / state.project.timeSigNum) + 1;
                rctx.fillStyle = '#888899';
                rctx.font = '10px -apple-system, sans-serif';
                rctx.fillText(barNum, x + 3, 12);
            }

            rctx.beginPath();
            rctx.moveTo(x, isBar ? 16 : 22);
            rctx.lineTo(x, 28);
            rctx.strokeStyle = isBar ? '#555568' : '#333348';
            rctx.lineWidth = 1;
            rctx.stroke();
        }

        // Playhead on ruler
        const playX = beatsToPixels(secondsToBeats(state.transport.position)) - scrollX;
        rctx.fillStyle = '#ff4a5a';
        rctx.beginPath();
        rctx.moveTo(playX - 5, 0);
        rctx.lineTo(playX + 5, 0);
        rctx.lineTo(playX, 8);
        rctx.fill();
    }

    startAnimation() {
        const animate = () => {
            this.render();
            this._updatePlayhead();
            this._animFrame = requestAnimationFrame(animate);
        };
        animate();
    }

    stopAnimation() {
        if (this._animFrame) cancelAnimationFrame(this._animFrame);
    }

    _noteNameToMidi(noteName) {
        const names = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
        const match = noteName.match(/^([A-G]b?)(\d+)$/);
        if (!match) return 60;
        return (parseInt(match[2]) + 1) * 12 + names.indexOf(match[1]);
    }

    _updatePlayhead() {
        const playhead = document.getElementById('playhead');
        const scrollX = document.getElementById('timeline-scroll').scrollLeft;
        const x = beatsToPixels(secondsToBeats(state.transport.position));
        playhead.style.left = x + 'px';

        // Update time display
        document.getElementById('time-display').textContent = formatTime(state.transport.position);
    }
}

// ---- Instrument Engine ----
// ---- Synth Engine ----
class SynthEngine {
    constructor(audioEngine) {
        this.ae = audioEngine;
        this.activeVoices = new Map(); // noteName -> voice
        this.params = {
            wave: 'sawtooth', wave2: 'none', detune: 0, mix: 50,
            filterType: 'lowpass', cutoff: 8000, resonance: 1,
            attack: 0.01, decay: 0.2, sustain: 0.7, release: 0.3,
            lfoRate: 5, lfoDepth: 0, lfoTarget: 'pitch'
        };
        this.noteNames = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
        this.visualizerCtx = null;
        this.analyser = null;
    }

    init() {
        const canvas = document.getElementById('synth-visualizer');
        if (canvas) this.visualizerCtx = canvas.getContext('2d');
        // Create analyser for visualizer
        if (this.ae.ctx) {
            this.analyser = this.ae.ctx.createAnalyser();
            this.analyser.fftSize = 256;
            this.analyser.connect(this.ae.masterGain);
        }
        this._startVisualizer();
        this._bindControls();
    }

    playNote(noteName) {
        this.stopNote(noteName);
        const ctx = this.ae.ctx;
        if (!ctx) return;
        this.ae.resume();

        const freq = this._noteToFreq(noteName);
        const now = ctx.currentTime;
        const p = this.params;

        // Voice structure
        const voice = { nodes: [] };

        // Oscillator 1
        const osc1 = ctx.createOscillator();
        osc1.type = p.wave;
        osc1.frequency.value = freq;
        osc1.detune.value = p.detune;
        voice.nodes.push(osc1);

        // Oscillator 2 (optional)
        let osc2 = null;
        let oscMerge = null;
        if (p.wave2 !== 'none') {
            osc2 = ctx.createOscillator();
            osc2.type = p.wave2;
            osc2.frequency.value = freq;
            osc2.detune.value = -p.detune;
            voice.nodes.push(osc2);

            // Mix oscillators
            const gain1 = ctx.createGain();
            const gain2 = ctx.createGain();
            gain1.gain.value = (100 - p.mix) / 100;
            gain2.gain.value = p.mix / 100;
            osc1.connect(gain1);
            osc2.connect(gain2);
            oscMerge = ctx.createGain();
            gain1.connect(oscMerge);
            gain2.connect(oscMerge);
        } else {
            oscMerge = ctx.createGain();
            osc1.connect(oscMerge);
        }

        // Filter
        const filter = ctx.createBiquadFilter();
        filter.type = p.filterType;
        filter.frequency.value = p.cutoff;
        filter.Q.value = p.resonance;
        oscMerge.connect(filter);

        // ADSR envelope
        const envGain = ctx.createGain();
        envGain.gain.setValueAtTime(0, now);
        envGain.gain.linearRampToValueAtTime(0.5, now + p.attack);
        envGain.gain.linearRampToValueAtTime(p.sustain * 0.5, now + p.attack + p.decay);
        filter.connect(envGain);

        // LFO
        if (p.lfoDepth > 0) {
            const lfo = ctx.createOscillator();
            lfo.frequency.value = p.lfoRate;
            const lfoGain = ctx.createGain();

            if (p.lfoTarget === 'pitch') {
                lfoGain.gain.value = p.lfoDepth * 2;
                lfo.connect(lfoGain);
                lfoGain.connect(osc1.frequency);
                if (osc2) lfoGain.connect(osc2.frequency);
            } else if (p.lfoTarget === 'filter') {
                lfoGain.gain.value = p.lfoDepth * 50;
                lfo.connect(lfoGain);
                lfoGain.connect(filter.frequency);
            } else if (p.lfoTarget === 'volume') {
                lfoGain.gain.value = p.lfoDepth / 200;
                lfo.connect(lfoGain);
                lfoGain.connect(envGain.gain);
            }
            lfo.start(now);
            voice.lfo = lfo;
            voice.nodes.push(lfo);
        }

        // Connect to analyser + output
        envGain.connect(this.analyser);

        // Start
        osc1.start(now);
        if (osc2) osc2.start(now);

        voice.envGain = envGain;
        voice.filter = filter;
        this.activeVoices.set(noteName, voice);
    }

    stopNote(noteName) {
        const voice = this.activeVoices.get(noteName);
        if (!voice) return;
        const ctx = this.ae.ctx;
        const now = ctx.currentTime;
        const p = this.params;

        voice.envGain.gain.cancelScheduledValues(now);
        voice.envGain.gain.setValueAtTime(voice.envGain.gain.value, now);
        voice.envGain.gain.linearRampToValueAtTime(0, now + p.release);

        setTimeout(() => {
            voice.nodes.forEach(n => { try { n.stop(); } catch(e) {} });
            try { voice.envGain.disconnect(); } catch(e) {}
            try { voice.filter.disconnect(); } catch(e) {}
        }, (p.release + 0.1) * 1000);

        this.activeVoices.delete(noteName);
    }

    _noteToFreq(noteName) {
        const match = noteName.match(/^([A-G]b?)(\d+)$/);
        if (!match) return 440;
        const noteNum = this.noteNames.indexOf(match[1]);
        const octave = parseInt(match[2]);
        const midiNote = (octave + 1) * 12 + noteNum;
        return 440 * Math.pow(2, (midiNote - 69) / 12);
    }

    _startVisualizer() {
        const draw = () => {
            requestAnimationFrame(draw);
            if (!this.visualizerCtx || !this.analyser) return;
            const canvas = this.visualizerCtx.canvas;
            const ctx = this.visualizerCtx;
            const w = canvas.width, h = canvas.height;
            const data = new Uint8Array(this.analyser.frequencyBinCount);
            this.analyser.getByteTimeDomainData(data);

            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = '#4a7fff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            const sliceW = w / data.length;
            for (let i = 0; i < data.length; i++) {
                const v = data[i] / 128.0;
                const y = v * h / 2;
                if (i === 0) ctx.moveTo(0, y);
                else ctx.lineTo(i * sliceW, y);
            }
            ctx.stroke();
        };
        draw();
    }

    _bindControls() {
        const bind = (id, param, transform) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', () => {
                const val = transform ? transform(el.value) : parseFloat(el.value);
                this.params[param] = val;
                const display = document.getElementById(id + '-val');
                if (display) {
                    if (param === 'cutoff') display.textContent = val >= 1000 ? (val/1000).toFixed(1)+'k' : val;
                    else display.textContent = typeof val === 'number' ? (Number.isInteger(val) ? val : val.toFixed(2)) : val;
                }
            });
        };
        bind('synth-wave', 'wave', v => v);
        bind('synth-wave2', 'wave2', v => v);
        bind('synth-detune', 'detune');
        bind('synth-mix', 'mix');
        bind('synth-filter-type', 'filterType', v => v);
        bind('synth-cutoff', 'cutoff');
        bind('synth-resonance', 'resonance');
        bind('synth-attack', 'attack');
        bind('synth-decay', 'decay');
        bind('synth-sustain', 'sustain');
        bind('synth-release', 'release');
        bind('synth-lfo-rate', 'lfoRate');
        bind('synth-lfo-depth', 'lfoDepth');
        bind('synth-lfo-target', 'lfoTarget', v => v);
    }

    // Keyboard mapping (same as InstrumentEngine)
    handleKeyDown(code) {
        const keyMap = {
            'KeyA': 0, 'KeyW': 1, 'KeyS': 2, 'KeyE': 3, 'KeyD': 4, 'KeyF': 5,
            'KeyT': 6, 'KeyG': 7, 'KeyY': 8, 'KeyH': 9, 'KeyU': 10, 'KeyJ': 11,
            'KeyK': 12, 'KeyO': 13, 'KeyL': 14
        };
        const octave = 4;
        const offset = keyMap[code];
        if (offset !== undefined) {
            const noteNames = this.noteNames;
            const oct = octave + Math.floor(offset / 12);
            const noteName = `${noteNames[offset % 12]}${oct}`;
            this.playNote(noteName);
            return true;
        }
        return false;
    }

    handleKeyUp(code) {
        const keyMap = {
            'KeyA': 0, 'KeyW': 1, 'KeyS': 2, 'KeyE': 3, 'KeyD': 4, 'KeyF': 5,
            'KeyT': 6, 'KeyG': 7, 'KeyY': 8, 'KeyH': 9, 'KeyU': 10, 'KeyJ': 11,
            'KeyK': 12, 'KeyO': 13, 'KeyL': 14
        };
        const octave = 4;
        const offset = keyMap[code];
        if (offset !== undefined) {
            const oct = octave + Math.floor(offset / 12);
            const noteName = `${this.noteNames[offset % 12]}${oct}`;
            this.stopNote(noteName);
            return true;
        }
        return false;
    }
}

// ---- Sound Matcher (Audio Feature Extraction) ----
class SoundMatcher {
    constructor(audioEngine) {
        this.ae = audioEngine;
        this.referenceFeatures = null; // Features of uploaded reference sound
    }

    /**
     * Analyseer een AudioBuffer en extraheer spectrale features.
     * Returns: { spectralCentroid, spectralRolloff, energy, zeroCrossings, mfcc-achtig profiel }
     */
    analyzeBuffer(audioBuffer) {
        const data = audioBuffer.getChannelData(0);
        const sampleRate = audioBuffer.sampleRate;
        const frameSize = 2048;
        const hopSize = 1024;
        const numFrames = Math.floor((data.length - frameSize) / hopSize);

        let totalCentroid = 0, totalRolloff = 0, totalEnergy = 0, totalZCR = 0;
        const spectrumProfile = new Float32Array(64); // Gemiddeld spectrum in 64 banden

        for (let frame = 0; frame < numFrames; frame++) {
            const start = frame * hopSize;
            const chunk = data.slice(start, start + frameSize);

            // FFT via eenvoudige DFT-benadering (neem de magnitude)
            const fft = this._fft(chunk, frameSize);

            // Spectral centroid
            let weightedSum = 0, magnitudeSum = 0;
            for (let i = 0; i < fft.length; i++) {
                const freq = (i * sampleRate) / (frameSize * 2);
                weightedSum += freq * fft[i];
                magnitudeSum += fft[i];
            }
            if (magnitudeSum > 0) totalCentroid += weightedSum / magnitudeSum;

            // Spectral rolloff (freq waar 85% energie zit)
            const threshold = magnitudeSum * 0.85;
            let cumSum = 0;
            for (let i = 0; i < fft.length; i++) {
                cumSum += fft[i];
                if (cumSum >= threshold) {
                    totalRolloff += (i * sampleRate) / (frameSize * 2);
                    break;
                }
            }

            // Energy
            let energy = 0;
            for (let i = 0; i < chunk.length; i++) energy += chunk[i] * chunk[i];
            totalEnergy += energy / chunk.length;

            // Zero crossings
            let zcr = 0;
            for (let i = 1; i < chunk.length; i++) {
                if ((chunk[i] >= 0) !== (chunk[i-1] >= 0)) zcr++;
            }
            totalZCR += zcr;

            // Accumulate spectrum profile (64 banden)
            const bandsPerBin = Math.floor(fft.length / 64);
            for (let b = 0; b < 64; b++) {
                let bandEnergy = 0;
                for (let j = 0; j < bandsPerBin; j++) {
                    bandEnergy += fft[b * bandsPerBin + j] || 0;
                }
                spectrumProfile[b] += bandEnergy / bandsPerBin;
            }
        }

        const n = Math.max(numFrames, 1);
        // Normalize spectrum profile
        const maxSpectrum = Math.max(...spectrumProfile) || 1;
        for (let i = 0; i < 64; i++) spectrumProfile[i] /= maxSpectrum;

        return {
            centroid: totalCentroid / n,
            rolloff: totalRolloff / n,
            energy: totalEnergy / n,
            zeroCrossings: totalZCR / n,
            duration: audioBuffer.duration,
            spectrumProfile: Array.from(spectrumProfile)
        };
    }

    _fft(signal, size) {
        // Simplified magnitude spectrum using Goertzel-like approach
        const halfSize = size / 2;
        const magnitudes = new Float32Array(halfSize);
        // Hanning window + simplified DFT for key frequencies
        const windowed = new Float32Array(size);
        for (let i = 0; i < size; i++) {
            windowed[i] = signal[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / size));
        }
        // Compute magnitude at 128 evenly spaced frequency bins (fast approx)
        const step = Math.max(1, Math.floor(halfSize / 128));
        for (let k = 0; k < halfSize; k += step) {
            let real = 0, imag = 0;
            const omega = 2 * Math.PI * k / size;
            for (let n = 0; n < size; n += 4) { // Downsample for speed
                real += windowed[n] * Math.cos(omega * n);
                imag -= windowed[n] * Math.sin(omega * n);
            }
            const mag = Math.sqrt(real * real + imag * imag);
            for (let j = 0; j < step && k + j < halfSize; j++) {
                magnitudes[k + j] = mag;
            }
        }
        return magnitudes;
    }

    /**
     * Vergelijk twee feature sets. Returns een similarity score 0-100.
     */
    compareSounds(featA, featB) {
        // Gewogen cosine similarity op spectrum + feature matching
        let spectrumSim = 0, dotProduct = 0, normA = 0, normB = 0;
        for (let i = 0; i < 64; i++) {
            dotProduct += featA.spectrumProfile[i] * featB.spectrumProfile[i];
            normA += featA.spectrumProfile[i] ** 2;
            normB += featB.spectrumProfile[i] ** 2;
        }
        spectrumSim = normA > 0 && normB > 0 ? dotProduct / (Math.sqrt(normA) * Math.sqrt(normB)) : 0;

        // Centroid similarity (log scale)
        const centroidSim = 1 - Math.min(1, Math.abs(Math.log2((featA.centroid+1) / (featB.centroid+1))) / 3);

        // Rolloff similarity
        const rolloffSim = 1 - Math.min(1, Math.abs(Math.log2((featA.rolloff+1) / (featB.rolloff+1))) / 3);

        // Energy similarity
        const energySim = 1 - Math.min(1, Math.abs(Math.log2((featA.energy+0.001) / (featB.energy+0.001))) / 5);

        // ZCR similarity (brightness indicator)
        const zcrSim = 1 - Math.min(1, Math.abs(featA.zeroCrossings - featB.zeroCrossings) / 500);

        // Gewogen gemiddelde
        const score = (spectrumSim * 0.45 + centroidSim * 0.2 + rolloffSim * 0.15 + energySim * 0.1 + zcrSim * 0.1) * 100;
        return Math.round(Math.max(0, Math.min(100, score)));
    }

    /**
     * Match een reference AudioBuffer tegen alle geladen sounds in de engine.
     */
    async matchAgainstLibrary(referenceBuffer) {
        this.referenceFeatures = this.analyzeBuffer(referenceBuffer);

        const results = [];
        // Vergelijk met alle geladen audio buffers
        for (const [soundId, buffer] of this.ae.audioBuffers.entries()) {
            const features = this.analyzeBuffer(buffer);
            const score = this.compareSounds(this.referenceFeatures, features);
            results.push({ soundId, score, features });
        }

        results.sort((a, b) => b.score - a.score);
        return results.slice(0, 20);
    }

    /**
     * Render een mini spectrum balk op een canvas.
     */
    renderSpectrum(canvas, features) {
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, w, h);

        const profile = features.spectrumProfile;
        const barW = w / 64;
        for (let i = 0; i < 64; i++) {
            const barH = profile[i] * h;
            const hue = 210 + (profile[i] * 60);
            ctx.fillStyle = `hsl(${hue}, 70%, ${40 + profile[i] * 30}%)`;
            ctx.fillRect(i * barW, h - barH, barW - 0.5, barH);
        }
    }
}

class InstrumentEngine {
    constructor(audioEngine) {
        this.audioEngine = audioEngine;
        this.currentInstrument = 'acoustic_grand_piano';
        this.octave = 4;
        this.soundfontUrl = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/';
        this.loadedInstruments = new Map(); // instrumentName -> { note -> AudioBuffer }
        this.activeNotes = new Map(); // note -> { source, gain }
        this.isDrumMode = false;
        this.loading = false;

        // Note names voor keyboard mapping
        this.noteNames = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

        // PC keyboard -> noten mapping (A-L = witte toetsen, W-P = zwarte)
        this.keyMap = {
            'KeyA': 0,  // C
            'KeyW': 1,  // C#
            'KeyS': 2,  // D
            'KeyE': 3,  // D#
            'KeyD': 4,  // E
            'KeyF': 5,  // F
            'KeyT': 6,  // F#
            'KeyG': 7,  // G
            'KeyY': 8,  // G#
            'KeyH': 9,  // A
            'KeyU': 10, // A#
            'KeyJ': 11, // B
            'KeyK': 12, // C (next octave)
            'KeyO': 13, // C#
            'KeyL': 14, // D
        };

        // Drum kit mapping
        this.drumSounds = [
            { name: 'Kick', note: 'C2', key: 'KeyA', color: '#ff4a5a' },
            { name: 'Snare', note: 'D2', key: 'KeyS', color: '#4a7fff' },
            { name: 'Clap', note: 'Eb2', key: 'KeyD', color: '#ffd24a' },
            { name: 'Hi-Hat Closed', note: 'Gb2', key: 'KeyF', color: '#4aff6a' },
            { name: 'Hi-Hat Open', note: 'Ab2', key: 'KeyG', color: '#4affd2' },
            { name: 'Tom High', note: 'A2', key: 'KeyH', color: '#ff8a4a' },
            { name: 'Tom Mid', note: 'B2', key: 'KeyJ', color: '#9a4aff' },
            { name: 'Tom Low', note: 'C3', key: 'KeyK', color: '#ff4aaa' },
            { name: 'Crash', note: 'Db3', key: 'KeyL', color: '#8aff4a' },
            { name: 'Ride', note: 'Eb3', key: 'Semicolon', color: '#4ad2ff' },
            { name: 'Bongo Hi', note: 'E3', key: 'KeyQ', color: '#ffa07a' },
            { name: 'Bongo Lo', note: 'F3', key: 'KeyW', color: '#dda0dd' },
            { name: 'Conga Hi', note: 'G3', key: 'KeyE', color: '#98fb98' },
            { name: 'Conga Lo', note: 'Ab3', key: 'KeyR', color: '#87ceeb' },
            { name: 'Cowbell', note: 'Bb3', key: 'KeyT', color: '#f0e68c' },
            { name: 'Tambourine', note: 'B3', key: 'KeyY', color: '#deb887' },
        ];
    }

    async loadInstrument(instrumentName) {
        if (this.loadedInstruments.has(instrumentName)) return;
        if (this.loading) return;

        this.loading = true;
        const loadingEl = document.getElementById('instrument-loading');
        if (loadingEl) loadingEl.style.display = 'inline';

        const buffers = {};
        const noteRange = this.isDrumMode ?
            this.drumSounds.map(d => d.note) :
            this._getNotesForInstrument();

        let loaded = 0;
        const total = noteRange.length;

        // Load notes in parallel batches of 6
        for (let i = 0; i < noteRange.length; i += 6) {
            const batch = noteRange.slice(i, i + 6);
            const promises = batch.map(async note => {
                try {
                    const noteFile = note.replace('#', '%23').replace('b', 'b');
                    const url = `${this.soundfontUrl}${instrumentName}-mp3/${note}.mp3`;
                    const response = await fetch(url);
                    if (!response.ok) return;
                    const arrayBuffer = await response.arrayBuffer();
                    buffers[note] = await this.audioEngine.ctx.decodeAudioData(arrayBuffer);
                    loaded++;
                } catch (e) {
                    // Note niet beschikbaar, skip
                }
            });
            await Promise.all(promises);
        }

        this.loadedInstruments.set(instrumentName, buffers);
        this.loading = false;
        if (loadingEl) loadingEl.style.display = 'none';
        console.log(`Instrument geladen: ${instrumentName} (${loaded}/${total} noten)`);
    }

    _getNotesForInstrument() {
        // Laad 3 octaven rond het huidige octaaf
        const notes = [];
        for (let oct = this.octave - 1; oct <= this.octave + 2; oct++) {
            if (oct < 0 || oct > 8) continue;
            for (const name of this.noteNames) {
                notes.push(`${name}${oct}`);
            }
        }
        return notes;
    }

    async setInstrument(instrumentName) {
        this.isDrumMode = instrumentName === '__drums__';
        if (this.isDrumMode) {
            this.currentInstrument = 'synth_drum';
            // Voor drums gebruiken we oscillator-gebaseerde sounds
            this._renderDrumPads();
        } else {
            this.currentInstrument = instrumentName;
            await this.loadInstrument(instrumentName);
            this._renderPianoKeyboard();
        }
        this._updateUI();
    }

    playNote(noteName) {
        if (!this.audioEngine.ctx) return;
        this.audioEngine.resume();

        // Stop bestaande noot als die speelt
        this.stopNote(noteName);

        const ctx = this.audioEngine.ctx;
        const gain = ctx.createGain();
        gain.gain.value = 0.6;
        gain.connect(this.audioEngine.masterGain);

        let source;

        if (this.isDrumMode) {
            // Drum mode: gebruik oscillator-gebaseerde percussie
            source = this._createDrumSound(noteName, gain);
        } else {
            // Instrument mode: gebruik soundfont sample
            const buffers = this.loadedInstruments.get(this.currentInstrument);
            if (!buffers || !buffers[noteName]) {
                // Fallback: gebruik oscillator
                source = this._createOscillatorNote(noteName, gain);
            } else {
                source = ctx.createBufferSource();
                source.buffer = buffers[noteName];
                source.connect(gain);
                source.start();
            }
        }

        this.activeNotes.set(noteName, { source, gain });

        // Visual feedback
        this._setKeyActive(noteName, true);
    }

    stopNote(noteName) {
        const note = this.activeNotes.get(noteName);
        if (note) {
            try {
                const ctx = this.audioEngine.ctx;
                note.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
                setTimeout(() => {
                    try { note.source.stop(); } catch(e) {}
                    note.gain.disconnect();
                }, 200);
            } catch(e) {}
            this.activeNotes.delete(noteName);
        }
        this._setKeyActive(noteName, false);
    }

    _createOscillatorNote(noteName, gainNode) {
        const ctx = this.audioEngine.ctx;
        const freq = this._noteToFreq(noteName);
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        osc.connect(gainNode);
        osc.start();
        return osc;
    }

    _createDrumSound(noteName, gainNode) {
        const ctx = this.audioEngine.ctx;
        const drum = this.drumSounds.find(d => d.note === noteName);
        if (!drum) return this._createOscillatorNote(noteName, gainNode);

        const now = ctx.currentTime;

        // Verschillende drum sounds via synthesis
        switch (drum.name) {
            case 'Kick': {
                const osc = ctx.createOscillator();
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
                gainNode.gain.setValueAtTime(1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gainNode);
                osc.start(now);
                osc.stop(now + 0.5);
                return osc;
            }
            case 'Snare': {
                // Noise + tone
                const bufferSize = ctx.sampleRate * 0.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 1000;
                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.gain.setValueAtTime(0.8, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                noise.start(now);
                noise.stop(now + 0.2);
                return noise;
            }
            case 'Clap': {
                const bufferSize = ctx.sampleRate * 0.15;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const env = Math.exp(-i / (ctx.sampleRate * 0.05));
                    data[i] = (Math.random() * 2 - 1) * env;
                }
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 2500;
                source.connect(filter);
                filter.connect(gainNode);
                source.start(now);
                return source;
            }
            case 'Hi-Hat Closed':
            case 'Hi-Hat Open': {
                const dur = drum.name.includes('Open') ? 0.3 : 0.08;
                const bufferSize = ctx.sampleRate * dur;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * dur * 0.3));
                }
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 7000;
                source.connect(filter);
                filter.connect(gainNode);
                gainNode.gain.value = 0.4;
                source.start(now);
                return source;
            }
            case 'Bongo Hi':
            case 'Bongo Lo':
            case 'Conga Hi':
            case 'Conga Lo': {
                const freq = drum.name.includes('Hi') ? 400 : 200;
                const baseFreq = drum.name.includes('Bongo') ? freq * 1.2 : freq;
                const osc = ctx.createOscillator();
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + 0.15);
                gainNode.gain.setValueAtTime(0.7, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gainNode);
                osc.start(now);
                osc.stop(now + 0.2);
                return osc;
            }
            case 'Cowbell': {
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                osc1.frequency.value = 800;
                osc2.frequency.value = 540;
                const merge = ctx.createGain();
                merge.gain.value = 0.5;
                osc1.connect(merge);
                osc2.connect(merge);
                merge.connect(gainNode);
                gainNode.gain.setValueAtTime(0.6, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc1.start(now); osc2.start(now);
                osc1.stop(now + 0.3); osc2.stop(now + 0.3);
                return osc1;
            }
            default: {
                // Generic tom/percussion
                const freq = 100 + Math.random() * 200;
                const osc = ctx.createOscillator();
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.3, now + 0.2);
                gainNode.gain.setValueAtTime(0.7, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gainNode);
                osc.start(now);
                osc.stop(now + 0.25);
                return osc;
            }
        }
    }

    _noteToFreq(noteName) {
        const match = noteName.match(/^([A-G]b?)(\d+)$/);
        if (!match) return 440;
        const noteNum = this.noteNames.indexOf(match[1]);
        const octave = parseInt(match[2]);
        const midiNote = (octave + 1) * 12 + noteNum;
        return 440 * Math.pow(2, (midiNote - 69) / 12);
    }

    _setKeyActive(noteName, active) {
        if (this.isDrumMode) {
            const drum = this.drumSounds.find(d => d.note === noteName);
            if (drum) {
                const pad = document.querySelector(`.drum-pad[data-note="${noteName}"]`);
                if (pad) pad.classList.toggle('active', active);
            }
        } else {
            const key = document.querySelector(`.piano-key[data-note="${noteName}"]`);
            if (key) key.classList.toggle('active', active);
        }
    }

    _renderPianoKeyboard() {
        const container = document.getElementById('piano-keyboard');
        container.style.display = 'flex';
        document.getElementById('drum-pads').classList.remove('active');

        let html = '';
        const startOct = Math.max(0, this.octave - 1);
        const endOct = Math.min(8, this.octave + 2);

        for (let oct = startOct; oct <= endOct; oct++) {
            for (let i = 0; i < 12; i++) {
                const noteName = `${this.noteNames[i]}${oct}`;
                const isBlack = [1, 3, 6, 8, 10].includes(i);
                const keyClass = isBlack ? 'black' : 'white';
                const label = isBlack ? '' : `${this.noteNames[i]}${oct}`;

                html += `<div class="piano-key ${keyClass}" data-note="${noteName}"
                    onmousedown="daw.instruments.playNote('${noteName}')"
                    onmouseup="daw.instruments.stopNote('${noteName}')"
                    onmouseleave="daw.instruments.stopNote('${noteName}')">
                    <span class="piano-key-label">${label}</span>
                </div>`;
            }
        }
        container.innerHTML = html;
    }

    _renderDrumPads() {
        document.getElementById('piano-keyboard').style.display = 'none';
        const container = document.getElementById('drum-pads');
        container.classList.add('active');

        container.innerHTML = this.drumSounds.map(drum => `
            <div class="drum-pad" data-note="${drum.note}"
                 style="border-left: 3px solid ${drum.color}"
                 onmousedown="daw.instruments.playNote('${drum.note}')">
                <span class="drum-pad-name">${drum.name}</span>
                <span class="drum-pad-key">${drum.key.replace('Key', '')}</span>
            </div>
        `).join('');
    }

    _updateUI() {
        document.getElementById('octave-display').textContent = this.octave;
    }

    handleKeyDown(code) {
        if (this.isDrumMode) {
            const drum = this.drumSounds.find(d => d.key === code);
            if (drum) { this.playNote(drum.note); return true; }
        } else {
            if (code === 'KeyZ') { this.octave = Math.max(0, this.octave - 1); this._updateUI(); this._renderPianoKeyboard(); return true; }
            if (code === 'KeyX') { this.octave = Math.min(8, this.octave + 1); this._updateUI(); this._renderPianoKeyboard(); return true; }

            const noteOffset = this.keyMap[code];
            if (noteOffset !== undefined) {
                const oct = this.octave + Math.floor(noteOffset / 12);
                const noteIdx = noteOffset % 12;
                const noteName = `${this.noteNames[noteIdx]}${oct}`;
                this.playNote(noteName);
                return true;
            }
        }
        return false;
    }

    handleKeyUp(code) {
        if (this.isDrumMode) {
            // Drums zijn one-shot, geen stop nodig
            return false;
        }
        const noteOffset = this.keyMap[code];
        if (noteOffset !== undefined) {
            const oct = this.octave + Math.floor(noteOffset / 12);
            const noteIdx = noteOffset % 12;
            const noteName = `${this.noteNames[noteIdx]}${oct}`;
            this.stopNote(noteName);
            return true;
        }
        return false;
    }
}

// ---- DAW Controller ----
class DAWController {
    constructor() {
        this.engine = new AudioEngine();
        this.instruments = null;
        this.renderer = null;
        this.meterAnimFrame = null;
    }

    async init() {
        await this.engine.init();

        // Instruments
        this.instruments = new InstrumentEngine(this.engine);
        this.synth = new SynthEngine(this.engine);
        this.matcher = new SoundMatcher(this.engine);

        const canvas = document.getElementById('timeline-canvas');
        const rulerCanvas = document.getElementById('ruler-canvas');
        this.renderer = new TimelineRenderer(canvas, rulerCanvas);

        this._bindEvents();
        this._bindInstrumentEvents();
        this._addDefaultTracks();
        this.renderer.resize();
        this.renderer.startAnimation();
        this._startMeterAnimation();

        // Sync scroll between track headers and timeline
        const timelineScroll = document.getElementById('timeline-scroll');
        const trackHeadersList = document.getElementById('track-headers-list');
        timelineScroll.addEventListener('scroll', () => {
            trackHeadersList.scrollTop = timelineScroll.scrollTop;
        });

        window.addEventListener('resize', () => {
            this.renderer.resize();
        });

        // Init default instrument + synth
        this.instruments._renderPianoKeyboard();
        this.synth.init();
        this._bindSoundMatchEvents();

        toast('DAW geladen', 'success');
    }

    _addDefaultTracks() {
        this.addTrack('Audio 1', 'audio');
        this.addTrack('Audio 2', 'audio');
        this.addTrack('Piano', 'midi', 'acoustic_grand_piano');
        this.addTrack('Drums', 'midi', 'synth_drum');
    }

    showAddTrackDialog() {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal">
                <h2>Nieuwe Track</h2>

                    </button>
                    <button class="modal-btn primary" id="add-midi-track" style="flex:1;padding:16px;font-size:14px;background:var(--purple)">
                        MIDI Track<br><span style="font-size:10px;opacity:0.7">Noten / instrumenten</span>
                    </button>
                </div>
                <div id="midi-instrument-select" style="display:none;margin-bottom:12px">
