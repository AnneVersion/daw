<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAW - Digital Audio Workstation</title>
<style>
/* ============================================================
   CSS - Dark Theme (Logic Pro inspired)
   ============================================================ */
:root {
    --bg-darkest: #0a0a0f;
    --bg-dark: #12121a;
    --bg-panel: #1a1a26;
    --bg-track: #1e1e2e;
    --bg-track-alt: #222235;
    --bg-hover: #2a2a3e;
    --bg-selected: #2d2d4a;
    --border: #333348;
    --border-light: #444460;
    --text: #e0e0ee;
    --text-dim: #888899;
    --text-bright: #ffffff;
    --accent: #4a7fff;
    --accent-hover: #5a8fff;
    --accent-dim: #3a5fcc;
    --red: #ff4a5a;
    --red-dim: #cc3a4a;
    --green: #4aff6a;
    --green-dim: #2a8a3a;
    --yellow: #ffd24a;
    --orange: #ff8a4a;
    --purple: #9a4aff;
    --track-colors: #4a7fff, #ff4a5a, #4aff6a, #ffd24a, #ff8a4a, #9a4aff,
                    #4affd2, #ff4aaa, #8aff4a, #4ad2ff;
    --scrollbar-bg: #1a1a26;
    --scrollbar-thumb: #444460;
    --waveform-opacity: 0.85;
    --fader-width: 4px;
    --track-height: 70px;
    --header-height: 48px;
    --ruler-height: 28px;
    --track-header-width: 180px;
    --bottom-panel-height: 180px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    font-size: 12px;
    color: var(--text);
    background: var(--bg-darkest);
    user-select: none;
    -webkit-user-select: none;
}

/* Scrollbars */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--scrollbar-bg); }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* ---- Header / Transport ---- */
#header {
    height: var(--header-height);
    background: linear-gradient(180deg, #1e1e30 0%, #16162a 100%);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    z-index: 100;
    overflow: hidden;
}
#logo {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    min-width: 60px;
}

/* Transport buttons */
#transport {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-dark);
    border-radius: 8px;
    padding: 4px 8px;
    border: 1px solid var(--border);
}
.transport-btn {
    width: 32px; height: 32px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}
.transport-btn:hover { background: var(--bg-hover); color: var(--text); }
.transport-btn.active { color: var(--text-bright); background: var(--bg-selected); }
.transport-btn.record { color: var(--red-dim); }
.transport-btn.record.active { color: var(--red); background: rgba(255,74,90,0.15); }
.transport-btn.play.active { color: var(--green); background: rgba(74,255,106,0.15); }

/* Time display */
#time-display {
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 18px;
    color: var(--text-bright);
    background: var(--bg-darkest);
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    min-width: 120px;
    text-align: center;
    letter-spacing: 1px;
}

/* BPM & Time Sig */
.header-control {
    display: flex;
    align-items: center;
    gap: 4px;
}
.header-control label {
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
}
.header-input {
    width: 50px;
    background: var(--bg-darkest);
    border: 1px solid var(--border);
    color: var(--text-bright);
    padding: 4px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 13px;
    text-align: center;
}
.header-input:focus {
    outline: none;
    border-color: var(--accent);
}

/* Project name */
#project-name {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    min-width: 150px;
}
#project-name:hover { border-color: var(--border); }
#project-name:focus { border-color: var(--accent); outline: none; color: var(--text-bright); }

/* Spacer */
.spacer { flex: 1; }

/* Header buttons */
.header-btn {
    padding: 5px 10px;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
}
.header-btn:hover { background: var(--bg-hover); color: var(--text); }

/* ---- Main Layout ---- */
#main {
    display: flex;
    flex-direction: column;
    height: calc(100vh - var(--header-height));
}
#workspace {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
}

/* ---- Track Headers (left panel) ---- */
#track-headers {
    width: var(--track-header-width);
    min-width: var(--track-header-width);
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
#track-headers-ruler {
    height: var(--ruler-height);
    background: var(--bg-dark);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0 8px;
}
#add-track-btn {
    padding: 2px 8px;
    background: var(--accent-dim);
    border: none;
    color: var(--text);
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
}
#add-track-btn:hover { background: var(--accent); }

#track-headers-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
}

.track-header {
    height: var(--track-height);
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    position: relative;
}
.track-header:hover { background: var(--bg-hover); }
.track-header.selected { background: var(--bg-selected); }

.track-header-top {
    display: flex;
    align-items: center;
    gap: 4px;
}
.track-color {
    width: 4px;
    height: 16px;
    border-radius: 2px;
}
.track-name {
    flex: 1;
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: none;
    padding: 1px 4px;
    border-radius: 2px;
    width: 80px;
}
.track-name:focus {
    background: var(--bg-dark);
    outline: none;
    color: var(--text-bright);
}
.track-delete {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
}
.track-header:hover .track-delete { opacity: 0.6; }
.track-delete:hover { opacity: 1 !important; color: var(--red); }

.track-controls {
    display: flex;
    gap: 3px;
    align-items: center;
}
.track-btn {
    width: 22px; height: 18px;
    border: 1px solid var(--border);
    background: var(--bg-dark);
    color: var(--text-dim);
    font-size: 9px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.track-btn:hover { border-color: var(--border-light); color: var(--text); }
.track-btn.mute-active { background: var(--yellow); color: #000; border-color: var(--yellow); }
.track-btn.solo-active { background: var(--accent); color: #fff; border-color: var(--accent); }
.track-btn.arm-active { background: var(--red); color: #fff; border-color: var(--red); }

.track-volume {
    flex: 1;
    height: 3px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 2px;
    outline: none;
}
.track-volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    background: var(--text-dim);
    border-radius: 50%;
    cursor: pointer;
}
.track-volume::-webkit-slider-thumb:hover { background: var(--text); }

/* ---- Timeline Area ---- */
#timeline-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}
#ruler {
    height: var(--ruler-height);
    background: var(--bg-dark);
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
}
#ruler-canvas {
    width: 100%;
    height: 100%;
}
#timeline-scroll {
    flex: 1;
    overflow: auto;
    position: relative;
}
#timeline-canvas {
    display: block;
}

/* Playhead */
#playhead {
    position: absolute;
    top: 0;
    width: 1px;
    background: var(--red);
    z-index: 50;
    pointer-events: none;
    height: 100%;
}
#playhead::before {
    content: '';
    position: absolute;
    top: 0;
    left: -5px;
    width: 11px;
    height: 8px;
    background: var(--red);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
}

/* ---- Bottom Panel (Mixer / Library) ---- */
#bottom-panel {
    height: var(--bottom-panel-height);
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}
#bottom-tabs {
    display: flex;
    background: var(--bg-dark);
    border-bottom: 1px solid var(--border);
}
.bottom-tab {
    padding: 6px 16px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 11px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
}
.bottom-tab:hover { color: var(--text); }
.bottom-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
}

#bottom-content {
    flex: 1;
    overflow: auto;
}

/* Mixer */
#mixer {
    display: flex;
    height: 100%;
    padding: 8px;
    gap: 2px;
    overflow-x: auto;
}
.mixer-channel {
    width: 70px;
    min-width: 70px;
    background: var(--bg-track);
    border-radius: 6px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--border);
}
.mixer-channel.master {
    background: var(--bg-selected);
    border-color: var(--accent-dim);
    width: 80px;
    min-width: 80px;
}
.mixer-label {
    font-size: 9px;
    color: var(--text-dim);
    text-align: center;
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.mixer-meter {
    width: 8px;
    flex: 1;
    background: var(--bg-darkest);
    border-radius: 2px;
    position: relative;
    min-height: 60px;
}
.mixer-meter-fill {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(to top, var(--green), var(--yellow) 70%, var(--red) 95%);
    border-radius: 2px;
    transition: height 0.05s;
}
.mixer-fader {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 2px;
    writing-mode: bt-lr; /* vertical */
}
.mixer-fader::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 8px;
    background: var(--text-dim);
    border-radius: 2px;
    cursor: pointer;
}
.mixer-fader::-webkit-slider-thumb:hover { background: var(--text); }
.mixer-knob-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}
.mixer-knob {
    width: 24px; height: 24px;
    background: var(--bg-darkest);
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    position: relative;
}
.mixer-knob::after {
    content: '';
    position: absolute;
    top: 3px; left: 50%;
    width: 2px; height: 6px;
    background: var(--text-dim);
    transform-origin: bottom center;
    border-radius: 1px;
}
.mixer-knob-label {
    font-size: 8px;
    color: var(--text-dim);
    text-transform: uppercase;
}
.mixer-buttons {
    display: flex;
    gap: 2px;
}

/* Library panel */
#library {
    display: none;
    height: 100%;
    padding: 8px;
}
#library.active { display: flex; flex-direction: column; gap: 8px; }
#library-search {
    display: flex;
    gap: 8px;
    align-items: center;
}
#library-search input {
    flex: 1;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
}
#library-search input:focus { outline: none; border-color: var(--accent); }
#library-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 6px;
}
.library-item {
    background: var(--bg-track);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    cursor: grab;
    display: flex;
    gap: 8px;
    align-items: center;
}
.library-item:hover { border-color: var(--accent-dim); background: var(--bg-hover); }
.library-waveform {
    width: 60px;
    height: 30px;
    background: var(--bg-darkest);
    border-radius: 2px;
}
.library-info { flex: 1; }
.library-name { font-size: 11px; color: var(--text); font-weight: 500; }
.library-meta { font-size: 9px; color: var(--text-dim); }
.library-fav {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
}
.library-fav.active { color: var(--yellow); }

/* ---- Synth Panel ---- */
#synth-panel {
    display: none;
    height: 100%;
    padding: 8px;
    gap: 8px;
}
#synth-panel.active { display: flex; }

.synth-section {
    background: var(--bg-track);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 120px;
}
.synth-section-title {
    font-size: 9px;
    text-transform: uppercase;
    color: var(--accent);
    letter-spacing: 1px;
    font-weight: 600;
}
.synth-knob-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.synth-knob-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}
.synth-knob-group label {
    font-size: 8px;
    color: var(--text-dim);
    text-transform: uppercase;
}
.synth-knob-group input[type="range"] {
    width: 60px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 2px;
    outline: none;
}
.synth-knob-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
}
.synth-knob-group select {
    background: var(--bg-dark);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 10px;
}
.synth-knob-group .value-display {
    font-size: 9px;
    color: var(--text);
    font-family: 'SF Mono', 'Consolas', monospace;
    min-width: 30px;
    text-align: center;
}
#synth-visualizer {
    width: 120px;
    height: 60px;
    background: var(--bg-darkest);
    border-radius: 4px;
    border: 1px solid var(--border);
}

/* ---- Sound Match Panel ---- */
#sound-match {
    display: none;
    height: 100%;
    padding: 8px;
    flex-direction: column;
    gap: 8px;
}
#sound-match.active { display: flex; }

#match-toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
}
#match-drop-zone {
    flex: 1;
    height: 50px;
    border: 2px dashed var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
}
#match-drop-zone:hover, #match-drop-zone.dragover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(74,127,255,0.05);
}
#match-results {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.match-result {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: var(--bg-track);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
}
.match-result:hover { border-color: var(--accent-dim); }
.match-score {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    min-width: 45px;
    text-align: center;
}
.match-info { flex: 1; }
.match-name { font-size: 11px; color: var(--text); font-weight: 500; }
.match-detail { font-size: 9px; color: var(--text-dim); }
.match-spectrum {
    width: 80px;
    height: 30px;
    background: var(--bg-darkest);
    border-radius: 3px;
}
#match-status {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding: 16px;
}

/* ---- Instruments Panel ---- */
#instruments {
    display: none;
    height: 100%;
    padding: 8px;
    flex-direction: column;
    gap: 8px;
}
#instruments.active { display: flex; }

#instrument-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
}
#instrument-select {
    background: var(--bg-dark);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
}
#instrument-select:focus { outline: none; border-color: var(--accent); }

.octave-control {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-dim);
}
.octave-btn {
    width: 22px; height: 22px;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.octave-btn:hover { background: var(--bg-hover); }

#instrument-info {
    font-size: 10px;
    color: var(--text-dim);
    margin-left: 12px;
}

/* Piano keyboard */
#piano-keyboard {
    display: flex;
    height: 90px;
    position: relative;
    overflow-x: auto;
}
.piano-key {
    position: relative;
    cursor: pointer;
    transition: background 0.05s;
    flex-shrink: 0;
}
.piano-key.white {
    width: 32px;
    height: 90px;
    background: linear-gradient(180deg, #f0f0f0 0%, #d8d8d8 100%);
    border: 1px solid #999;
    border-radius: 0 0 4px 4px;
    z-index: 1;
}
.piano-key.white:hover { background: linear-gradient(180deg, #e8e8ff 0%, #c8c8e0 100%); }
.piano-key.white.active { background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%); }
.piano-key.black {
    width: 22px;
    height: 58px;
    background: linear-gradient(180deg, #333 0%, #111 100%);
    border: 1px solid #000;
    border-radius: 0 0 3px 3px;
    margin-left: -11px;
    margin-right: -11px;
    z-index: 2;
}
.piano-key.black:hover { background: linear-gradient(180deg, #444466 0%, #222244 100%); }
.piano-key.black.active { background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%); }
.piano-key-label {
    position: absolute;
    bottom: 4px;
    width: 100%;
    text-align: center;
    font-size: 8px;
    color: #888;
    pointer-events: none;
}
.piano-key.black .piano-key-label { color: #666; bottom: 2px; font-size: 7px; }

/* Drum pads */
#drum-pads {
    display: none;
    gap: 6px;
    flex-wrap: wrap;
    height: 90px;
    align-content: start;
}
#drum-pads.active { display: flex; }

.drum-pad {
    width: 72px;
    height: 40px;
    background: var(--bg-track);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s;
    gap: 2px;
}
.drum-pad:hover { border-color: var(--accent-dim); background: var(--bg-hover); }
.drum-pad.active { background: var(--accent); border-color: var(--accent); transform: scale(0.95); }
.drum-pad-name { font-size: 10px; color: var(--text); font-weight: 500; }
.drum-pad-key { font-size: 8px; color: var(--text-dim); }

/* Loading indicator */
.instrument-loading {
    font-size: 11px;
    color: var(--accent);
    animation: pulse 1s infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}

/* ---- Piano Roll Modal ---- */
#piano-roll-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
}
#piano-roll {
    width: 90vw;
    height: 75vh;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
#piano-roll-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: var(--bg-dark);
    border-bottom: 1px solid var(--border);
}
#piano-roll-header h3 { font-size: 14px; color: var(--text-bright); flex: 1; }
#piano-roll-body {
    display: flex;
    flex: 1;
    overflow: hidden;
}
#piano-roll-keys {
    width: 48px;
    min-width: 48px;
    background: var(--bg-dark);
    border-right: 1px solid var(--border);
    overflow: hidden;
}
.pr-key {
    height: 14px;
    border-bottom: 1px solid var(--border);
    font-size: 8px;
    display: flex;
    align-items: center;
    padding-left: 4px;
    color: var(--text-dim);
    cursor: pointer;
}
.pr-key.black { background: #1a1a26; }
.pr-key.white { background: #222235; }
.pr-key:hover { background: var(--bg-hover); }
.pr-key.c-note { border-bottom: 1px solid var(--accent-dim); color: var(--text); }

#piano-roll-grid-container {
    flex: 1;
    overflow: auto;
    position: relative;
}
#piano-roll-canvas {
    display: block;
}

/* ---- Resize handle ---- */
#bottom-resize {
    height: 4px;
    background: var(--border);
    cursor: ns-resize;
}
#bottom-resize:hover { background: var(--accent-dim); }

/* ---- Context menu ---- */
.context-menu {
    position: fixed;
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 6px;
    padding: 4px 0;
    z-index: 1000;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    min-width: 160px;
}
.context-menu-item {
    padding: 6px 16px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.context-menu-item:hover { background: var(--accent); color: white; }
.context-menu-sep {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
}

/* ---- Modal ---- */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}
.modal {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    min-width: 400px;
    max-width: 500px;
}
.modal h2 { font-size: 16px; margin-bottom: 16px; color: var(--text-bright); }
.modal-input {
    width: 100%;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 12px;
}
.modal-input:focus { outline: none; border-color: var(--accent); }
.modal-buttons {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px;
}
.modal-btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-dark);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
}
.modal-btn:hover { background: var(--bg-hover); }
.modal-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}
.modal-btn.primary:hover { background: var(--accent-hover); }

/* ---- Drag preview ---- */
.drag-preview {
    position: fixed;
    background: var(--accent);
    opacity: 0.7;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 11px;
    color: white;
    pointer-events: none;
    z-index: 999;
}

/* ---- Toast notifications ---- */
#toast-container {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.toast {
    background: var(--bg-panel);
    border: 1px solid var(--border);

    padding: 10px 16px;

}
.toast.error { border-color: var(--red-dim); }
.toast.success { border-color: var(--green-dim); }
@keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
